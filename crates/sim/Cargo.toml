[package]
name = "frontline-sim"
description = "Deterministic simulation core for Frontline (no Godot, no floats in sim state)."
license = "LicenseRef-Proprietary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Match setups (defs resolved to fixed point) come from the open content
# crate; the sim reads them but never touches files (§7.9: closed code may
# depend on the open SDK, not the other way round).
frontline-content.workspace = true
serde.workspace = true
postcard.workspace = true
xxhash-rust.workspace = true
rayon.workspace = true
thiserror.workspace = true

[lints]
workspace = true
