# Battalion tier caps (§2.2): 700 soldiers, 1,800-round projectile pool, 3 x 3 km.
# Vehicles arrive in M2; this is the infantry part of the tier.
# Note: the M0 sim spawns soldiers uniformly over the whole map, so crowds are
# sparse at this map size; ORCA load is light until spawn areas exist.
name = "battalion"
description = "Battalion tier: 700 soldiers, projectile pool 1,800, 3 x 3 km noise terrain."
seed = 1
tick_hz = 30
hash_interval = 30

[map]
size_m = 3072
heightfield = { kind = "noise", amplitude_m = 14 }

[forces]
players = 2
soldiers = 700

[projectiles]
# Heavy fighting: the fire interval is tuned so the pool runs at roughly 85-90 %
# with no dropped shots (over 1,800 ticks, seed 1: about 1,490 live rounds on average,
# peak about 1,610 of 1,800).
pool_cap = 1800
fire_interval_ms = { min = 400, max = 1250 }
