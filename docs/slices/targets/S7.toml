# S7 targets (docs/slices/S7-casemate-td.md), machine-checkable part.
# Owner 2026-11-06: "Start S7": assault guns and tank destroyers (StuG III G,
# M10), the general vehicle schema, casemate gunnery, open-top exposure.
# Copied from S6b.toml with every target and band unchanged (T4-T27), plus
# the S7 targets T30-T38 at the end. Baseline numbers in the comments come
# from the verified S6b JSON (scratchpad/verify-s6b, head 9f216e9).
#   frontline-cli targets docs/slices/targets/S7.toml --jobs 6 [--runs skirmish40]
# Run names are the first word of each metric. Balance batches use --jobs 6;
# tick-time targets (T14) read `timing40`, which fixes jobs = 3 and must run
# alone on a quiet machine (docs/process/workflows.md section 4).
# New JSON fields (Build stages add them; spec "Targets"):
#   skirmish: factions.<f>.s7.{kills_by_vehicle, kos_by_vehicle,
#     open_top_throws, relocations} and factions.<f>.s7_derived.{
#     bought_matches_pct.<card>, mp_share_pct.<card>, vehicle_mp_pct,
#     kills_by_vehicle_pct.<vehicle>, vehicle_kills_pct,
#     kills_by_vehicle_max_pct, kos_per_bought.<vehicle>,
#     open_top_throws_per_match}
#   armour-test: cases 17-20 with the check names used below.
# Not checked here (cargo tests, see the spec): the port proof (Pz IV and
# Sherman behave as before: armour-test case 1-3 numbers, golden ballistics
# and 40 skirmish matches equal before and after the port), per-field
# save/load/hash tests, determinism at 1/2/3/8 threads with save/load,
# Godot checks and the screenshot, golden/validate/clippy/fmt (check.sh).

name = "S7 assault guns and tank destroyers"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

