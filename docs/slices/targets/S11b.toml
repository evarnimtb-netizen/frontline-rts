# S11b targets (docs/slices/S11b.md 7, 8), machine-checkable part.
# A copy of S11a2.toml at 8d2731b (T4-T148 unchanged in value and kind) except:
#   - name changed;
#   - skirmish40_a_off now also loads S11b-ablations/s11b_off.toml (with the
#     S11b switches on, the older files alone no longer equal base 730e67f;
#     the X1 counter keys s9.guns_emplaced, s9.gun_crew_lost and the
#     s9_derived values made of them differ by design);
#   - five more control runs: skirmish40_s11b_off (every S11b switch 0: must
#     equal the reference set target/s11b-A0-40, tools/neutral.py),
#     skirmish40_a0_off (cb_alternate 0), skirmish40_how_off,
#     skirmish40_light_off, skirmish40_rg_off;
#   - T30, T40, T54 are NOT re-based (owner question S11b-10 (A): the
#     balance pass does that);
#   - new rows T149-T158 in three-part form (value, exposure, control).
#   tools/measure.sh OUTDIR docs/slices/targets/S11b.toml
# Seeds: measurement sets 1-80, 101-180, 201-280; held out 301-380 (not
# played by this slice); screening uses 1001 and up only.
# ROW HONESTY rules of S10b-ai.toml hold unchanged (three_parts_from T109).
# The s11b metric names are fixed by docs/slices/S11b.md 4 (M1, M2) and 7
# (Build C builds them). Rows with no design figure are reports and say so.
# Written by the Plan stage without a parse run of the CLI (another session
# was playing match sets in the tree): Build A runs `frontline-cli targets`
# on it first (S11b-build-A.md chunk 0). Revised 2026-11-19 after the
# measured diagnosis and the plan review (T149, T150, T153, T158).
name = "S11b: field howitzers, light mortars, HE rifle grenades, A0 fixes (S11a2 targets plus T149-T158)"
three_parts_from = "T109"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.skirmish160_s201]
seeds = 80
first_seed = 201      # second out-of-sample set: seeds 201-280 (pooled band)
kind = "skirmish"
both_bases = true
minutes = 45

[runs.skirmish160_h301]   # B1 held-out set: played once on the frozen change set
seeds = 80
first_seed = 301      # seeds 301-380, never used to choose a value
kind = "skirmish"
both_bases = true
minutes = 45

[runs.skirmish40_off]      # control: every new S10b-ai switch 0 (must equal main)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S10b-ai-ablations/all_off.toml"]

[runs.skirmish40_loose]    # control: materials_max_pct 100, refused_s 0, job_max_s 36000
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S10b-ai-ablations/loose.toml"]

[runs.skirmish40_c_off]    # control: every S10c-ai key off (must equal main 54009f6)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S10c-ai-ablations/c_off.toml"]

[runs.skirmish40_a_off]    # control: every S11a1, S11a2 and S11b switch off (must equal base 730e67f but for the X1 counter keys)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11a1-ablations/a_off.toml", "docs/slices/targets/S11a2-ablations/b_off.toml", "docs/slices/targets/S11b-ablations/s11b_off.toml"]

[runs.skirmish40_b_off]    # control: every S11a2 switch off, the S11b switches as shipped (not the S11a1 result since S11b)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11a2-ablations/b_off.toml"]

[runs.skirmish40_ff_off]   # control: friendly_fire 0 and ff_safe 0 (counter-battery and the S11b switches as shipped)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11a2-ablations/ff_off.toml"]

[runs.skirmish40_ff_safe_off]   # control: friendly fire on, the AI's own-men rule off
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11a2-ablations/ff_safe_off.toml"]

[runs.skirmish40_s11b_off]   # control: every S11b switch off (cb_alternate, buy_pending, how, light, rifle_grenades 0: must equal the reference set)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11b-ablations/s11b_off.toml"]

[runs.skirmish40_a0_off]   # control: cb_alternate 0: an AI gun may counter-fire twice in a row (as S11a2)
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11b-ablations/a0_off.toml"]

[runs.skirmish40_how_off]   # control: the AI buys no field howitzer
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11b-ablations/how_off.toml"]

[runs.skirmish40_light_off]   # control: the AI buys no light mortar
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11b-ablations/light_off.toml"]

[runs.skirmish40_rg_off]   # control: no rifle grenades are issued
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
rules_override = ["docs/slices/targets/S11b-ablations/rg_off.toml"]

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

