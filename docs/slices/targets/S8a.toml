# --- T34: casemate duel (armour-test case 17, 18; vehicles.md 10) -------------
# 17: StuG frontal vs Sherman frontal at 300 m. The StuG's 80 mm / 10°
# front against the M61 (about 50 % pen at 300 m) vs the Sherman's glacis
# against the PzGr 39 (pens): the StuG should win most.
[[target]]
id = "T34a"
metric = "armour5.cases.case17.checks.stug_wins_pct.value"
min = 55
[[target]]
