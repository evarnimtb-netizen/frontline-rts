# S8a targets (docs/slices/S8a-halftracks.md), machine-checkable part.
# Owner 2026-11-06: "start an overnight session for next development
# process"; roadmap S8 split for the weekly plan limit: S8a = half-tracks
# (SdKfz 251/1 D, M3A1) and the systems they need (small arms vs thin armour,
# transport, pintle MGs, shields, half-track mobility); S8b = trucks, recon.
# Copied from S7.toml with every target and band unchanged (T4-T38; T34e and
# T36a stay reports), plus run skirmish160_s201 and the S8a targets T40-T49 at
# the end. Baseline numbers in the comments come from the verified S7 JSON
# after the tick fix (scratchpad/verify-s7fix, head 17a94df): Germany 48.1 /
# 44.4 / 48.1 % (pooled 46.9 % over 480); T5d and T32a missed there.
#   frontline-cli targets docs/slices/targets/S8a.toml --jobs 6 [--runs skirmish40]
# Run names are the first word of each metric. Balance batches use --jobs 6;
# tick-time targets (T14) read `timing40`, which fixes jobs = 3 and must run
# alone on a quiet machine (docs/process/workflows.md section 4).
# New JSON fields (Build stages add them; spec "Targets"):
#   skirmish: factions.<f>.s8a.{rides, ride_ticks, ride_walk_ticks,
#     riders_lost, small_arms_pens, dismounts_under_fire, transport_trips}
#     and factions.<f>.s8a_derived.{transported_per_match,
#     ride_saved_s_per_ride, ride_saved_s_per_match, riders_lost_per_match,
#     small_arms_pens_per_match, dismounts_under_fire_pct,
#     transport_trips_per_bought}. The half-track
#     cards and vehicles appear in the existing s7_derived maps
#     (bought_matches_pct, kills_by_vehicle_pct, kills_by_vehicle_max_pct)
#     with no code change.
#   armour-test: cases 21-24 with the check names used below.
# Not checked here (cargo tests, see the spec): per-field save/load/hash
# tests (riding, door timer, pintle yaw), determinism at 1/2/3/8 threads with
# save/load/continue while embarked, net loopback with Embark/Disembark,
# Godot checks and the screenshot, golden/validate/clippy/fmt (check.sh).
name = "S8a half-tracks"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.skirmish160_s201]
seeds = 80
first_seed = 201      # second out-of-sample set: seeds 201-280 (pooled band)
kind = "skirmish"
both_bases = true
minutes = 45

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

