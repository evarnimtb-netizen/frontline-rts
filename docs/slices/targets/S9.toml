# S9 targets (docs/slices/S9-at-guns.md), machine-checkable part.
# Owner 2026-11-08: "continue through S9, then stop for the owner's decision".
# Slice S9 = AT guns: the gun entity with carriage and shield boxes, crews as
# soldiers in service slots, emplace/pack/push/hitch, towing, recrew/abandon/
# capture, optic sight bonus, HE at the crew, gun pit, AI ambush siting.
# Copied from S8b.toml with every target and band unchanged (T4-T72) except
# T33a/b (owner decision S8b-26 taken up for S9: the vehicle manpower cap
# counts tanks and tank destroyers/assault guns only), plus T73-T92 at the end.
# Baseline numbers come from the verified S8b build (scratchpad/verify-src,
# head 1ad2b52): Germany 41.9 / 47.5 / 50.0 %, pooled 46.5 % over 480.
#   frontline-cli targets docs/slices/targets/S9.toml --jobs 6 [--runs skirmish40]
# Run names are the first word of each metric. Balance batches use --jobs 6;
# tick-time targets (T14) read `timing40`, which fixes jobs = 3 and must run
# alone on a quiet machine (docs/process/workflows.md section 4).
#
# BALANCE IS JUDGED POOLED (owner, 2026-11-08): Germany 45-55 % over the three
# 160 sets pooled (480 matches; T5c, T5d, T5e are one set each with about
# +-7.7 points of noise: a set-level miss with the pool in band is noise and
# not a reason to tune). The log computes the pool, as in S8b.
#
# Fields the build stages add (a target naming a field not yet added prints
# MISS until its build stage is done):
#   s7_derived.tank_td_mp_pct (T33a/b; the Plan stage added it to json_out.rs,
#     a batch needs a re-run to show it).
#   factions.<f>.s9.{guns_bought, guns_emplaced, guns_in_cover, gun_rounds,
#     gun_ko_tanks, gun_crew_lost, guns_neutral,
#     guns_captured, guns_recrewed, tows_lost, ai_unhitches,
#     ai_ambush_rounds, gun_ai_fails} and
#   factions.<f>.s9_derived.{gun_fired_matches_pct, gun_in_cover_pct,
#     guns_bought_per_match, gun_rounds_per_match, gun_ko_tanks_per_match,
#     gun_crew_lost_per_match, guns_neutral_per_match, guns_captured_per_match,
#     captured_gun_kills_per_match, gun_mp_pct}.
#   New cards and vehicles appear in the existing s7_derived maps
#     (bought_matches_pct, mp_share_pct, kills_by_vehicle_pct,
#     kos_per_bought, kills_by_vehicle_max_pct) with no code change, under
#     ger_pak40(_squad), ger_pak38(_squad), usa_57mm_m1(_squad),
#     ger_sdkfz11(_squad).
#   armour-test: new cases 33-40 (crates/sim scenarios + armour_test/s9.rs).
# Not checked here (cargo tests, see the spec): per-field save/load/hash tests
# for every new state field, determinism at 1/2/3/8 threads with save/load
# during emplace, push, hitch, re-lay, capture and a neutral gun, net loopback
# with the new commands, Godot checks, golden/validate/clippy/fmt (check.sh).
name = "S9 AT guns"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.skirmish160_s201]
seeds = 80
first_seed = 201      # second out-of-sample set: seeds 201-280 (pooled band)
kind = "skirmish"
both_bases = true
minutes = 45

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

