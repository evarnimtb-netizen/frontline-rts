# --- T107: the bunker's protection against named weapons (R22-R26; done-when 6)
# Five men inside a built bunker. 300 staged rifle and MG rounds (Kar98k and
# MG 42 / M1 Garand and M1919) from 20 m at the front walls and slit: no hp
# lost by any piece (armour 100 > every small-arms pen, S10a 3.1). T107i is
# its control (review R6).
[[target]]
id = "T107a"
metric = "fortify10.s10b.bunker.small_arms_hp_lost"
max = 0
# Three 81 mm bombs (GrW 34 / M1, damage 150) on the roof centre: it stands
# (roof hp 1000) and nobody under it dies.
[[target]]
id = "T107b"
metric = "fortify10.s10b.bunker.survived_81mm_x3_pct"
min = 100
[[target]]
id = "T107c"
metric = "fortify10.s10b.bunker.sheltered_losses"
max = 0
# A satchel laid at the slit (design 7.6 "satchel against the slit") kills
# men inside through the opening; 40 verify. Since review R7 it is a real
# Demolish order clicked at the slit (the charge where Demolish lays it,
# bunker facing down the slope); T107k (facing up) and T107l (the same at
# the back wall, no opening) are reports beside it.
[[target]]
id = "T107d"
metric = "fortify10.s10b.bunker.slit_satchel_losses_pct"
min = 40
