# --- T41: squads transported per match, time saved per ride --------------------
# A transported squad = one that boarded at least `[ai.transport] min_ride_m`
# away from where it got off. Saved time per ride (Fix, review M2): (straight
# walk from where the squad stood at the Embark order to the capture radius of
# the point it rode for) - (order to its lead inside that radius); it counts
# the walk to the door, the boarding wait and the last stretch on foot.
# Negative = slower. T41g/h keep the Build B vehicle-trip figure (an upper
# bound: boarding to the last man out, straight line from the door).
