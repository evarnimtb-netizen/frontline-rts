# ===========================================================================
# S10b targets. Sources: roster-expansion.md S10 done-when and scope;
# infantry-structures.md 7.6 (times, kg, effects, detection rule), 7.7 (who
# builds what); spec rules R1-R30 (docs/slices/S10b-obstacles.md). Rows run
# 10 seeds x both factions (20 runs) unless stated. "verify" = a starting
# value without a design figure; the measure that first reads it is logged.
# ===========================================================================

# --- T102: an AT mine stops a tank (R4, R5; done-when 1) --------------------
# A tank (Pz IV H / M4A3(75)W) driven so one track crosses one AT mine.
[[target]]
id = "T102a"
metric = "fortify10.s10b.atmine.direct_immobilised_pct"
min = 100
# The same tank driven straight through a three-row AT field (R2: rows 4 m
# apart, mines every 4 m, staggered by a third); lateral offset varied by seed.
# 75 is a geometry estimate (spec R5 note), verify.
[[target]]
id = "T102b"
metric = "fortify10.s10b.atmine.field_immobilised_pct"
min = 75
[[target]]
id = "T102c"
metric = "fortify10.s10b.atmine.field_knocked_out_pct"
min = 0
kind = "report"
note = "running gear only (S10b-3 (A)): expected 0"
# A rifle squad walking over the same AT field sets off nothing (R4).
[[target]]
id = "T102d"
metric = "fortify10.s10b.atmine.infantry_triggered"
max = 0
# T102d means something only if men came within trigger range of an AT mine
# (review R8): pairs of man and mine closer than trigger_cm, all runs.
[[target]]
id = "T102e"
metric = "fortify10.s10b.atmine.infantry_close_passes"
min = 1

# --- T103: an AP mine goes off only on contact (R3; done-when 2) -------------
# A man passing 50 cm from an AP mine never sets it off; one stepping within
# 30 cm always does.
[[target]]
id = "T103a"
metric = "fortify10.s10b.apmine.near_miss_triggered"
max = 0
[[target]]
id = "T103b"
metric = "fortify10.s10b.apmine.contact_triggered_pct"
min = 100
# A vehicle driven over an AP field sets off nothing (R3: foot only).
[[target]]
id = "T103c"
metric = "fortify10.s10b.apmine.vehicle_triggered"
max = 0
# A rifle squad crossing a two-row AP field (30 m, mines every 2 m).
[[target]]
id = "T103d"
metric = "fortify10.s10b.apmine.crossing_losses_pct"
min = 0
kind = "report"

# --- T104: a sweep finds mines at the expected rate (R8-R11; done-when 3) ----
# One clear_mines squad sweeps a 30 m lane with 10 enemy AP mines at known
# offsets. expected_pct = mean over mines of 1 - (1 - p)^n_i, p the per-tick
# chance (detect_pct_per_s / 100 / 30), n_i the ticks a sweeper was within
# 1.5 m (computed by the row from the run itself).
[[target]]
id = "T104a"
metric = "fortify10.s10b.sweep.found_vs_expected_pts"
max = 10
[[target]]
id = "T104b"
metric = "fortify10.s10b.sweep.lifted_of_found_pct"
min = 90
[[target]]
id = "T104c"
metric = "fortify10.s10b.sweep.found_pct"
min = 0
kind = "report"
[[target]]
id = "T104d"
metric = "fortify10.s10b.sweep.sweeper_losses"
min = 0
kind = "report"
# A Bangalore laid across the lane sets off the mines within its blast (R12).
[[target]]
id = "T104e"
metric = "fortify10.s10b.sweep.bangalore_cleared_pct"
min = 0
kind = "report"

