# S10b targets (docs/slices/S10b-obstacles.md), machine-checkable part.
# Slice S10b = the mechanics half of mines, AT obstacles and the bunker, with
# their clearing and demolition. New things are at ai_weight 0 / unused by the
# AI, so AI-vs-AI play must equal main 8acc534 match for match
# (tools/neutral.py against target/s10a-ai-verify; spec "Neutrality").
#   tools/measure.sh OUTDIR docs/slices/targets/S10b.toml   # the 40 set and the three 160 sets
#   frontline-cli targets docs/slices/targets/S10b.toml --runs fortify10   # the S10b rows only
#
# T4-T101 are S10a-ai.toml's targets with three owner-rule changes
# (owner 2026-11-11, docs/STATE.md "Process and owner rules" 1):
#   - T5c, T5d: the 35-65 % guard band (was 45-55);
#   - T31a-d, T55a, T55b, T95b, T95d: reports "until the balance pass";
#   - everything else unchanged. Being neutral, this slice reads exactly the
#     S10a-ai verify values: hard misses T8b, T40c, T54e, T88b, T88d (accepted
#     from S9b, S9b-3 (A)) are expected and must not move.
# Germany pooled (tools/pool.py, 480 matches) must equal S10a-ai's 41.67 %.
#
# New fields (S10b Build A adds them as zeros; Builds B-E fill them):
#   factions.<f>.s10b.*: FortAccount S10b counters (spec "Measures").
#   fortify10.s10b.<row>.*: the S10b fortify-test rows (spec "fortify-test rows").
name = "S10b obstacles, mines and the bunker (mechanics)"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.skirmish160_s201]
seeds = 80
first_seed = 201      # second out-of-sample set: seeds 201-280 (pooled band)
kind = "skirmish"
both_bases = true
minutes = 45

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

