# S6b targets (docs/slices/S6b-mortar-ai.md), machine-checkable part.
# Owner choice 2026-11-05: "Mortar AI pass first" (before S7): mortars reach
# the S5b-17 bands by AI behaviour only (mission size, bomb load, map fire;
# never lethality). Copied from S6.toml; every target and band unchanged.
# MAIN TARGETS of this slice: T9b (USA mortar share 10-15 %) and T8a / T8b
# (HE share of kills 20-26.3 %, in and out of sample); all others must hold.
#   frontline-cli targets docs/slices/targets/S6b.toml --jobs 6 [--runs skirmish40]
# Run names are the first word of each metric. Balance batches use --jobs 6;
# tick-time targets (T14) read `timing40`, which fixes jobs = 3 and must run
# alone on a quiet machine (docs/process/workflows.md section 4).
# Not checked here (cargo tests, see the spec): T20 mortar stops dry with no
# crate in reach, T21 crate within 5 m keeps it firing, T23 cook-off only on
# fragment contact, T24 tank rearm 1 per 4 s / rare 1 per 30 s to rare_cap,
# T25 caps and refusals, T26 crate price kg x kind price and no distance
# term, T12 determinism (1/2/3/8 threads, save/load, per-field tests),
# Godot checks and screenshots, golden/validate/clippy/fmt (tools/check.sh).

name = "S6b mortar AI pass"

[runs.skirmish40]
kind = "skirmish"
seeds = 20            # seeds 1-20 x both bases = 40 matches
both_bases = true
minutes = 45

[runs.timing40]       # the same 40 matches, run alone at 3 at a time
kind = "skirmish"
seeds = 20
both_bases = true
minutes = 45
jobs = 3

[runs.skirmish160]
kind = "skirmish"
seeds = 80            # seeds 1-80
both_bases = true
minutes = 45

[runs.skirmish160_oos]
kind = "skirmish"
seeds = 80
first_seed = 101      # out of sample: seeds 101-180
both_bases = true
minutes = 45

[runs.armour5]
kind = "armour-test"
seeds = 5

[runs.armour_stress10]
kind = "armour-test"
seeds = 10
stress = true

[runs.fortify10]
kind = "fortify-test"
seeds = 10

# --- T4: no AI fire-mission order refused (40 set) -------------------------
[[target]]
id = "T4a"
metric = "skirmish40.factions.germany.s5b_derived.refused_total"
max = 0
[[target]]
id = "T4b"
metric = "skirmish40.factions.usa.s5b_derived.refused_total"
max = 0

