halted_mm_s = 300
# Idle vehicles turn toward a threat more than face_slack_deg (deg) off
# their heading within face_range_m (m).
face_slack_deg = 20
face_range_m = 600
# Enemy vehicles this close to a point are an armour threat to it (m).
threat_m = 300
# A vehicle retreats with its engine under this share of its HP (percent).
retreat_engine_pct = 30
# A vehicle backing up an own point stands this far behind it (m).
backup_m = 30
# S3b call-in without a queue: after the vehicle unlock, while under the
