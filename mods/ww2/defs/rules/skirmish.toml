# S10b-ai: the AI lays mines, builds obstacles and the bunker, sweeps and
# demolishes (docs/slices/S10b-ai.md 2). Starting values; the six switches
# (1 on, 0 off) are the ablations of spec 2.
[ai.obstacles]
mines = 1                    # switch: AP and AT minefields
at_mines = 1                 # switch (under mines): AT minefields
obstacles = 1                # switch: log barriers and hedgehog rows
bunker = 1                   # switch: the bunker
sweep = 1                    # switch: sweeping lanes before an attack
demolish = 1                 # switch: demolishing obstacles in a vehicle's way
jobs_max = 2                 # S10b jobs at once, inside [ai.fort] builders_max (S10c-ai C1: 2; was 1)
materials_max_pct = 3        # %: S10b materials cost at most this share of the income earned (own budget, R8)
ap_beyond_wire_m = 5         # m: an AP field lies this far beyond the point's wire line (design 7.6 "among and before the wire") ...
ap_out_m = 40                # m: ... or this far out from the trench with no wire
at_out_m = 60                # m: an AT field lies this far out along the enemy vehicle approach (R2; verify)
fields_per_point = 2         # minefields per point (R4)
at_fields_max = 3            # AT minefields per player (R4)
obst_gun_m = 40              # m: a log barrier stands this far out in an own gun's arc (R5; verify)
obst_work_m = 20             # m: a hedgehog row stands this far in front of a nest or bunker (R5; verify)
hedgehogs_row = 3            # hedgehogs in a row ...
hedgehog_step_m = 4          # m: ... this far apart
own_route_m = 10             # m: no obstacle this close to an own vehicle route (R6)
bunkers_max = 1              # bunkers per player (R7)
suspect_s = 600              # s: an enemy mine blast hurting own units marks a suspect this long (R9)
sweep_near_m = 20            # m: a suspect or known mine this close to the attack line wants a sweep ...
sweep_point_m = 30           # m: ... or a known mine this close to the point (R10)
sweep_reach_m = 300          # m: a free sweeper this close may be sent (R10)
demolish_pieces_max = 3      # pieces one demolition job blows before it gives up (R14)
demolish_near_m = 30         # m: a known enemy piece this close to a stuck vehicle wants a demolition (R14)
obst_seen_m = 150            # m: enemy obstacles are known this close to an own unit (R13)
job_max_s = 900              # s: every S10b job ends after this long (L1)
refused_s = 300              # s: a refused goal is not ordered again within this ... (L4)
refused_m = 20               # m: ... within this distance (L4)
recheck_s = 60               # s: one vehicle approach search per point within this (R2)
bunker_assign = 1            # switch: a wanted bunker with no fit squad at its point takes one free build_heavy (else build_structure) squad
bunker_truck_first = 1       # switch: once per bunker job, its heavy step's material run may take a truck from tank service
barrier_job_max_s = 1200     # s: the L1 deadline of a log barrier job (every other job keeps job_max_s)
lane_file = 1                # switch: attackers walk a swept lane in single file on its centre line until past its end
at_rows = 2                  # rows of an AT field (1..=2): the second one step behind the first, shifted half a step along it
demolish_handover = 1        # switch (B1-0): a demolition squad without a satchel for its next piece hands the job to a free own demolish squad with one
bunker_yields = 1            # switch (B1-0): a bunker job waiting for its truck-borne material gives up the S10b job slot (jobs_max)
# S10c-ai (docs/slices/S10c-ai.md 2): defences at the front. The three
# switches start off (0) and each build stage turns its own on.
front = 1                    # switch (F1-F9): hasty AP field, wire and AT field on the enemy lanes of the front points, no trench first
mine_assign = 1              # switch (C2): a wanted front work with no fit squad at its point takes one free builder from anywhere
belt = 1                     # switch (C4): a row of blocking pieces across the vehicle lane beyond a front AT field (on: Build C chunk 2)
front_points = 2             # F1: this many own points nearest the enemy base are front points
front_out_m = 50             # m (F3): the front wire lies this far out along the foot lane; the AP field ap_beyond_wire_m beyond it
front_wire_len_m = 20        # m (F3): length of a front wire line (10 m shorter than the AP row, so a way round crosses the mines)
front_site_threat_m = 50     # m (F5): no front job start (and a drop) with a known enemy this close to the site; the builder keeps [ai] threat_radius
front_fields_max = 2         # F7: front AP fields per player
front_slots = 1              # C8: front jobs (FrontAp, FrontWire, front AT field, belt) at once
front_home = 0               # F1: 1 = the home point (nearest the own base) may be a front point; 0 = only while the enemy owns more than half of the points
belt_pieces = 5              # C4: blocking pieces in a belt ...
belt_gap_m = 10              # m (C4): ... this far beyond the AT field, on the enemy side
belt_detour_pct = 130        # % (C5): the own route round a belt is at most this share of the route without it; 0 = rule off
builder_cards_min = 2        # C3: with fewer living builder squads the next buy is a builder card; 0 = off (orchestrator 2026-11-16: 2, owner S10c-2 proposed (B))
mine_assign_reach_m = 450    # m (C2): mine_assign pulls a free builder only within this of the site (sweeps keep sweep_reach_m; fix pass 3: 450 of 450/600/800, none kept US losses <= 0.65)

# S11a1: the artillery AI (docs/slices/S11a1.md 2, rules A1-A6, P1-P3): one
# infantry gun and one observer team a side, observed missions inside a
# shell budget, preparation fire for the breach job. The three switches stay
# 0 until Build C (ablations arty_off, fo_off, prep_off).
[ai.arty]
buy = 1                      # A1 switch: buy an infantry gun
fo = 1                       # A3 switch: buy and post an observer team
prep = 1                     # P1-P3 switch: preparation fire for the breach job
after_s = 240                # s (A1): no gun before this (D 4.7 unlock 3:00 / 4:00)
income_max_pct = 15          # % (A1): infantry-gun cards cost at most this share of the income so far (half the AT-gun share)
reserve_mp = 0               # A1: manpower that stays after a gun is bought
max_guns = 1                 # A1: infantry guns alive or called in at once
fo_max = 1                   # A3: observer teams alive at once
fo_rebuy_s = 180             # s (A3): wait after an observer team is lost
mission_rounds = 4           # A4: rounds of one AI gun mission
reserve_pct = 30             # % (A4, A5): no new mission at or under this share of the gun's HE (D 6.4)
shell_mp_max_pct = 25        # % (A5): gun shells cost at most this share of the income so far (D 6.4)
danger_close_m = 50          # m (A4, A6): own men this close to the target: no mission, or lift (D 4.5)
post_m = 300                 # m (A3): the first post candidate this far short of the point ...
post_side_m = 60             # m: ... and this far either side
post_rays = 8                # A3: sight rays a plan's post search may cast
post_clear_m = 150           # m (A3): a candidate with a known enemy this close is passed over
post_retry_s = 60            # s (A3): a failed search waits this long
prep_near_m = 40             # m (P2): a mission this close to the breach focus is its preparation ...
prep_rounds_min = 2          # P2: ... once it has fired this many rounds ...
prep_wait_s = 60             # s (P2): ... and the breach job waits for it at most this long (D 6.4 prep_fire_s)
# S11a2 (docs/slices/S11a2.md 2): Build B turns them on (ablations ff_safe_off, counter_fire_off).
ff_safe = 1                  # S1-S3 switch: one own-men predicate for the order filter and the lift of every own mission
counter_fire = 1             # R1-R3 switch: an AI gun answers an own counter-battery marker with map fire
lift_m = 100                 # m (S1): an own squad walking to the target counts once its lead is this close (D 6.4)
cb_max_error_m = 60          # m (R2): no counter-fire on a marker wider than this (D 8 ai.cb_max_error_m)
# S11b (docs/slices/S11b.md 2): every switch 0 until Build C (ablations a0_off, how_off, light_off, s11b_off).
cb_alternate = 0             # X3 switch: an AI gun does not order counter-fire twice in a row (0..1)
buy_pending = 0              # H1 switch: gun buys count the manpower of call-ins still pending (0..1)
how = 0                      # H1 switch: the AI buys a field howitzer (0..1)
how_after_s = 480            # s (H1): no howitzer before this match time (D 837-838: unlock 8:00; 0..3600)
how_max = 1                  # H1: howitzers alive or called in at once (D 789, D 837-838; 0..8)
how_income_pct = 15          # % (H1): howitzer cards cost at most this share of the income so far, apart from income_max_pct (S11b-3; 0..100)
how_reserve_mp = 300         # H1: manpower that stays after the howitzer buy (plan value, S11b-13; 0..100000)
light = 0                    # L1 switch: cards tagged light_mortar join the mortar slot of the buy mix (0..1)

# S5b: mortar fire missions (docs/modding/fire-missions.md; design
# artillery-on-map.md §4.1 fire modes, §4.8 flight time). A mission is fired
# Direct (the mortar's own leader sees the point), Observed (another squad
# leader of the player, within the voice link of the gunner, sees it) or as
# Map fire (nobody linked sees it, but the player knows the point). Never
# blind: an order at ground the player has never seen is refused.
[fire_mission]
# --- Who observes, and the link ---
# A squad leader adjusts fire on ground points this far (m; binoculars).
# It reveals nothing: spotting enemy men still uses the squad's sight_m.
observe_leader_m = 400
# Men with the "observer" trait (FO teams, S11; none in ww2 yet) (m).
observe_observer_m = 1200
# Voice link: an observer within this of the mortar's gunner passes
# corrections (m). "A single section can usually communicate by word of
# mouth" (US WD Intelligence Bulletin, Feb 1944, German instructions for
# concentrating 81-mm mortar fire). Radio links: S6/S11.
observer_link_m = 150
# The sight line to a ground point ends this high above the ground (mm), and
# to a burst this high above it: the dust and smoke column an observer
# adjusts on (mm).
point_lift_mm = 500
burst_seen_lift_mm = 3000

# --- Timing (artillery-on-map.md §4.8) ---
# Order to first round: the call, the fire command, laying the tube (s);
# direct: the crew lays on what it sees (s). 10 s plus 13-21 s of flight is
# 23-31 s from order to the first burst (§4.8: 20-60 s for a voice-linked
# section). One value for both factions (S5b-9 (A)).
fire_direction_s = 10
direct_s = 4
# After an adjusting round bursts, the observer's correction reaches the
# tube and the tube is re-laid before the next round (s).
adjust_wait_s = 4
# Adjust single rounds until the aim error is at most ffe_error_m (m), or
# adjust_rounds_max rounds, then fire for effect at the weapon's rate.
# Bracketing: "split the bracket", 2-4 adjusting rounds (FM 23-90).
ffe_error_m = 10
adjust_rounds_max = 4

# --- Aim error: where the group lands relative to the target; the weapon's
# spread_mrad (precision) scatters each round around that on top ---
# Observed and direct: % of range with a floor (m) (S5b-11 (A): the design's
# 3 % with a mortar-sized floor, 10-18 m at 200-600 m) ...
first_round_error_pct = 3
first_round_error_min_m = 10
# ... and each round an observer SEES land leaves this share of the error
# (%; a hidden burst teaches nothing).
ranging_step_pct = 50
# Map fire (no observer; a known point): no ranging (% of range, floor m).
# Set on the mortar-bench (S5b-12 (A)) so the same 8-round mission misses
# about 3x as far as map fire as when a spotter in the voice link adjusts
# it: 50 seeds x both mortars at 200-500 m, mean miss observed 10.6 m, map
# fire 32.4 m, pooled ratio 3.04 (200 m 4.1, 300 m 3.1, 400 m 2.8, 500 m
# 2.8). The Plan's 9 % / 30 m (3x the observed first round) gave 3.39 and
# 4.5 at 200 m: ranging takes the observed mission below its first round.
map_fire_error_pct = 8
map_fire_error_min_m = 27

# --- Ranging memory (per mortar squad, per target area; S5b-4 (A): it only
# helps a later observed or direct mission, never map fire) ---
ranging_cell_m = 50          # m: a new mission within this of a ranged target reuses its error
ranging_expiry_s = 600       # s: forgotten after this
ranging_keep_move_m = 10     # m: forgotten when the tube moves farther than this
ranging_max_cells = 4        # most remembered target areas per mortar

# --- The knowledge map (intel) for map fire (S5b-3 (A)) ---
intel_cell_m = 25            # m: cell size of the player's knowledge grid
intel_keep_s = 300           # s: a cell where an enemy was last seen stays known this long
intel_trench_keep_s = 0      # s: a cell where an enemy was seen in a trench (0: the whole match)
intel_period_s = 1           # s: cells are updated this often
intel_snap_m = 25            # m: map fire within this of a known cell centre, a seen enemy or a capture point's edge

# --- Player orders ---
player_rounds = 6            # rounds in a mission ordered from the HUD tool (1..=50)

# --- S11a1: gun fire missions (docs/slices/S11a1.md 2, 4 G1-G6; design
# artillery-on-map.md §4.1, §4.8). A served gun whose main weapon has an
# [indirect] table takes FireMission on its own squad; no ww2 gun has one
# before S11a1 Build B. Switches: 1 on, 0 off (ablation a_off). ---
gun_missions = 1             # G1: 0 = a gun's mission is refused not_mortar (as before S11a1)
radio_link = 1               # G5: an observer also links by radio (a radio man near him, one near the tube); 0 = voice only
mask = 1                     # G2: a gun's arc must clear the ground (20 steps of the flight); 0 = no ground test
gun_fire_direction_s = 20    # s: a gun mission's order to first round (D 4.8: USA 15, Germany 25; one value until S11a2)
gun_adjust_rounds_max = 1    # a gun mission's adjusting rounds at most (D 4.8 adjust_rounds 1)
gun_first_round_error_pct = 3    # G4: observed and direct first-round error (% of range) ...
gun_first_round_error_min_m = 25 # ... at least this (m) (D 4.1 fire modes table)
gun_map_fire_error_pct = 6       # G4: map fire error (% of range) ...
gun_map_fire_error_min_m = 50    # ... at least this (m) (D 4.1)
gun_break_m = 150            # m (G6): a seen enemy this close to the gun ends its mission (crew self-defence)
# --- S11a2: friendly fire and counter-battery by sound (docs/slices/S11a2.md 2; D 4.3, D 6.3) ---
# Both switches stay 0 until S11a2 Build B (ablations ff_off, cb_off).
friendly_fire = 1            # F1 switch: mortar and gun mission bursts hurt own men (Q22; D 8 friendly_fire_indirect)
counter_battery = 1          # K1 switch: infantry-gun mission rounds leave sound evidence with the enemy (D 4.3)
cb_rounds_to_mark = 3        # K2: rounds heard from one spot before it is marked (D 8, gun)
cb_decay_s = 300             # s (K3): a spot loses one piece of evidence this often; at none it goes with its marker (D 8)
cb_delay_s = 15              # s (K2): the marker comes this long after the marking round (D 8)
cb_error_pct = 15            # % (K2): first marker error, of the listener's distance to the gun ...
cb_error_step_pct = 80       # % (K3): ... each further round leaves this share of it ...
cb_error_floor_pct = 5       # % (K3): ... down to this share of the listener's distance (D 8)
cb_reset_m = 75              # m (K1): a round this close to a spot (or inside its marker's error) counts for it (D 8)
cb_near_m = 20               # m (K4, report): a counter-fire burst this close to an enemy infantry gun is near (D 4.3)

