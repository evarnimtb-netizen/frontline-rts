# Skirmish rules (docs/slices/S1-skirmish.md "Economy", "Victory", "Capture").
id = "ww2:skirmish"
name = "Skirmish"
tick_hz = 30
hash_interval = 30
tickets = 500
# Soldiers per side, alive or called in. S4: 150 (owner Q6 (A)): squads at
# their historical sizes (10-12 men) need room; about 13 line squads.
pop_cap = 150
projectile_cap = 2048

[economy]
start_manpower = 600
income_per_min = 240
# Extra income per held capture point.
point_income_per_min = 60

[tickets_drain]
# Per point of difference in held points.
per_min_per_point = 20

[capture]
radius_m = 15
time_s = 20
# Capture speeds up with each man up to this many.
max_men = 4
# Each man beyond the first adds this much speed (percent of one man's).
# S3b: was rules.rs CAPTURE_EXTRA_MAN_PCT (S1 value).
extra_man_pct = 50

[movement]
# Path cost multiplier per 100 % grade: cost = base * (100 + grade_pct * slope_cost_pct / 100) / 100.
slope_cost_pct = 300
# Grid steps steeper than this are impassable.
max_slope_pct = 80
arrive_cm = 40
retreat_speed_pct = 140
# Members behind their formation slot walk this much faster.
catch_up_speed_pct = 125
# A man ordered prone crawls at this much of his walking speed.
prone_speed_pct = 30
# A* node expansions per tick (all players), and per single search.
path_budget_per_tick = 4000
path_max_expansions = 8000
# Steps between two trench cells cost this much of a normal step, so squads
# already in a trench line prefer to follow it.
trench_cost_pct = 60
# Infantry step cost into an AT-ditch cell (percent): men go round a ditch
# when a short detour exists (S3). S3b: was path.rs DITCH_COST_PCT.
ditch_cost_pct = 300

# Squad walking and soldier movement details. S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[movement.formation]
# A leader (or a detached man) moves on to his next waypoint within this (m).
waypoint_reach_m = 2
# A member this far from his slot is behind and speeds up (m).
catch_up_m = 2
# A member this far from his slot makes the leader slow down (m) ...
stretched_m = 10
# ... to this share of his speed (percent).
stretched_speed_pct = 70
# Members on the move aim this far past their moving slot, so they keep
# walking with the leader instead of stopping at it every tick (mm).
slot_lead_mm = 1500
# Arriving gives up waiting for stragglers after this long (s).
arrive_timeout_s = 20
# A man this close to a vehicle's avoidance circle, heading into it, slides
# round it instead of stopping in front of the hull (mm, S3).
slide_gap_mm = 1500
# Steep dug ground (trench walls, craters): grades up to this do not slow a
# man (percent grade over the next 0.25 m) ...
steep_free_pct = 60
# ... and his slowest pace is this much of his speed (percent). A 1.8 m
# trench wall (about 450 % grade) is climbed at about 15 %.
steep_min_pct = 15

# Dig profiles: a flat floor, walls sloping out over wall_cm to the lip,
# and a spoil bank (parapet or berm) on the enemy side. One man at
# dig_rate_pct = 100 does 100 work points per second.
[dig.profiles.trench]
# S4 Tune: 160 -> 180 cm (a 6 ft standing fighting trench). With the S4
# squads (ten and twelve men on a 27-33 m line) the 10-round 81 mm barrage on
# a squad in the 32 m test trench killed 44.9 % as many men as in the open
# (limit 40 %, S1 cover threshold); at 180 cm 33.3 %. fortify-test rifle row
# 0.5 %. Digging work per metre is unchanged.
depth_cm = 180
floor_cm = 80
wall_cm = 40
parapet_cm = 30
max_length_m = 60
# A rifle squad digs 20 m in about 3.5 min.
work_per_m = 8400
# It deepens in this many equal passes (each pass is visible).
passes = 8

# The anti-tank ditch (S3): about 3.4 m wide at the top and 2.3 m deep, so
# vehicles cannot cross it (their ditch_block_dm is 19). Engineers only;
# one 5-man engineer squad digs 10 m in about 3.7 min.
[dig.profiles.at_ditch]
depth_cm = 230
floor_cm = 100
wall_cm = 120
parapet_cm = 60
max_length_m = 30
work_per_m = 22000
passes = 8
engineers_only = true

# S6 pits: a short line dug to a rectangle with rounded ends and the spoil
# all round (all_round), so the parapet covers every side. pit_length_cm is
# the outside length; the dug line is that minus the floor and both walls.
# work_per_m is per metre of that short line, set so the pit's work matches
# its volume at the trench's 8,400 points for ~1.6 m3 a metre (5,250 a m3).
# FM 23-90 (81-mm mortar emplacement) and FM 5-15 (Field Fortifications,
# 1944) give pits of about these sizes (verify the exact dimensions).
# Mortar pit: 2.5 x 2.1 m outside, 1.1 m deep (about 5.8 m3, 30,000 points
# on a 0.4 m line). Engineers and the Zugtrupp dig it (S6-6 (A)).
[dig.profiles.mortar_pit]
depth_cm = 110
floor_cm = 130
wall_cm = 40
parapet_cm = 40
max_length_m = 5
work_per_m = 75000
passes = 4
all_round = true
pit_length_cm = 250

# HQ pit: 3.0 x 2.5 m outside, 1.5 m deep (about 11 m3: 58,000 points on a
# 0.5 m line; the 5-man Zugtrupp at 100 % digs it in about 2 min).
[dig.profiles.hq_pit]
depth_cm = 150
floor_cm = 170
wall_cm = 40
parapet_cm = 40
max_length_m = 5
work_per_m = 116000
passes = 4
all_round = true
pit_length_cm = 300

# Dump pit: 2.5 x 2.0 m outside, 1.2 m deep (about 6 m3).
# S9 AT gun pit: 5 x 3 m (verify), 55 cm deep (S9-9 (A): under the gun's
# wheel_block_dm 6, so no ramp), all-round spoil, engineers only; about 3 m3 of
# earth (guns-artillery.md 3.10: about 2 min for 4 engineers).
[dig.profiles.gun_pit]
depth_cm = 55
floor_cm = 300
wall_cm = 40
parapet_cm = 40
max_length_m = 6
work_per_m = 60000
passes = 3
all_round = true
pit_length_cm = 500
engineers_only = true

[dig.profiles.dump_pit]
depth_cm = 120
floor_cm = 120
wall_cm = 40
parapet_cm = 40
max_length_m = 5
work_per_m = 62000
passes = 4
all_round = true
pit_length_cm = 250

# S10a pits (docs/slices/S10a-fortifications.md 3.2), engineers only, all-round
# spoil, the S6 rate (about 5,250 points a m3). MG nest pit: 2.2 m long, 2.0 m
# wide, 90 cm deep (verify; about 4.4 m3, 23,000 points on a 0.2 m line).
[dig.profiles.mg_nest_pit]
depth_cm = 90
floor_cm = 120
wall_cm = 40
parapet_cm = 40
max_length_m = 5
work_per_m = 115000
passes = 3
all_round = true
pit_length_cm = 220
engineers_only = true

# Dugout pit: 3.0 x 2.5 m, 2 m deep (infantry-structures 5.10.3 "2 m deep pit";
# about 11-15 m3, 75,000 points on a 0.5 m line; verify).
[dig.profiles.dugout_pit]
depth_cm = 200
floor_cm = 170
wall_cm = 40
parapet_cm = 40
max_length_m = 5
work_per_m = 150000
passes = 4
all_round = true
pit_length_cm = 300
engineers_only = true

# S10b bunker pit (R22): 350 x 300 cm, 1.5 m deep, under the bunker's
# 420 x 370 cm roof; dug like the dugout's pit (verify). S10b Build E: no
# spoil bank (parapet 0; the spoil is the roof's earth): a 40 cm bank round
# the pit filled the 40 cm firing slit between the undug surface and the roof.
[dig.profiles.bunker_pit]
depth_cm = 150
floor_cm = 220
wall_cm = 40
parapet_cm = 0
max_length_m = 5
work_per_m = 150000
passes = 4
all_round = true
pit_length_cm = 350
engineers_only = true

# Every dig profile: the spoil bank shape and how close a digger works.
# S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[dig.common]
# The parapet rises over this run beyond the lip (mm) ...
parapet_rise_mm = 300
# ... stays at full height over this run (mm) ...
# S5a Tune: 400 -> 1400 (armour-test case 9 at the default 5 seeds, S4-47).
# With 400 mm a tank HE round aimed at a man standing on the fire step
# burst on the crest 1.4-1.9 m in front of him and killed him and his
# neighbours (verbose diagnostics: every trench death was a man standing to
# fire, never a ducked one), so 10-12-man squads lost 41-45 % as many men in
# the trench as in the open (limit 40 %). A real parapet is a bank of spoil
# about a metre thick, not a 40 cm hump (field-fortification manuals ask for
# roughly 1 m of earth against rifle fire; verify FM 5-15); the spoil of a
# 1.8 m trench is ample (the bank is ~0.6 m2 a metre, the dig ~2.2 m2).
# Case 9 at 5 / 10 seeds: 400 mm 42.9 / 45.1 %, 700 mm 34.5 / 34.8 %,
# 1000 mm 35.7 / 36.0 %, 1400 mm 27 / 28 %. fire_exposure_cm and the duck
# keys were tried and do not help (exposure below 25 cm stops the trench
# riflemen firing over the lip).
parapet_top_mm = 1400
# ... and falls back to the ground over this run (mm).
parapet_fall_mm = 600
# The parapet only raises ground at most this far below the base surface,
# so it never fills another trench or a crater (mm).
parapet_undug_mm = 50
# A digger works when this close to his spot (mm).
reach_mm = 1500
# S3b: an HE crater centred on raised spoil (a parapet) blows the loose
# spoil away within its radius down to this share of the crater depth below
# the spoil's top (never below the base surface) and raises no rim there
# (%). 150: loose earth flies further than dug ground; tank HE (0.3 m deep)
# then takes up to 0.45 m off a parapet (docs/slices/S3b-balance.md P5).
spoil_crater_pct = 150

[combat]
# Spotting: LOS rays per player per tick, and how often each enemy soldier
# is re-checked while the budget lasts. Each check tries the nearest few
# observers in range (one ray each).
spot_rays_per_tick = 160
spot_period_ms = 200
spot_observers = 2
# Sight range against prone, entrenched, wooded and firing targets (percent
# of the observer's sight; a recent shot replaces the other three).
prone_spot_pct = 50
trench_spot_pct = 60
woods_spot_pct = 50
firing_spot_pct = 150
reveal_ms = 2000
# Suppression, in points out of 100: rounds passing within near_miss_cm add
# the weapon's `suppression`, a hit adds hit_suppression. Soldiers crouch at
# crouch_suppression and are pinned (prone, no movement, worse aim) at
# pin_suppression.
near_miss_cm = 200
hit_suppression = 25
suppression_decay_per_s = 8
crouch_suppression = 30
pin_suppression = 70
# Accuracy: weapon spread is scaled while moving and while pinned, and grows
# linearly with range up to range_spread_pct extra at full range.
moving_spread_pct = 250
pinned_spread_pct = 200
range_spread_pct = 50
# A man firing from a trench stands on the fire step, this much above the
# parapet.
fire_exposure_cm = 30
corpse_s = 30

# A soldier's hit capsule and posture points, heights from the feet.
# S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[combat.body]
# Capsule heights by stance (mm): a standing man about 1.75 m.
stand_mm = 1750
crouch_mm = 1200
prone_mm = 400
# Capsule radius standing or crouched (mm).
radius_mm = 250
# Prone: a horizontal capsule along the heading, radius and half length (mm).
prone_radius_mm = 200
prone_half_mm = 700
# The muzzle sits this far below the top of the firing capsule (mm).
muzzle_drop_mm = 150
# Shooters aim at a man on a fire step this far below his top: head and
# shoulders (mm).
head_aim_mm = 150
# Eyes (and the head spotting point) this far below the top (mm).
eye_drop_mm = 100
# A man this far below the base surface stands in a trench (mm).
trench_depth_mm = 1000
# Slower than this counts as standing still: MG and mortar set-up, moving
# spread (mm/s).
still_mm_s = 300

# Mortar laying and flight. S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[combat.mortar]
# Muzzle height above the crew's feet (mm).
muzzle_mm = 800
# Legacy mortars only (a weapon without [indirect]; S5b: ww2 mortars fly by
# their charges): flight time is sqrt(range in m * flight_milli / 1000) s,
# at least min_flight_s: about a 60 degree arc at every range.
flight_milli = 350
min_flight_s = 4
# A team holding out of range walks to 90 % of its range again unless that
# spot is within this of its last walk; then the fire mission ends (m).
barrage_retry_m = 20

# HE bursts of shells, rockets and thrown items. S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[combat.blast]
# Damage and sight rays from a burst start this far above it (mm).
lift_mm = 300
# Crater depth roll, percent of the weapon's crater_depth, inclusive.
crater_depth_min_pct = 75
crater_depth_max_pct = 140
# A burst more than this above the ground under it (on a vehicle) carves no
# crater (mm).
crater_lift_mm = 500
# S3c (B8, T9; physical-contact rule): a burst on the ground throws its
# fragments in the HE def's frag_elev_deg band above the horizontal. Where
# the ground falls away beside the burst (a shell bursting on a parapet
# crest above the trench behind it), fragments also go down over the fall:
# the ground is sampled this far around the burst (8 directions), and the
# steepest drop lowers the band's minimum by its angle, with extra rays at
# the band's density (so flat ground is unchanged). Without it a tank HE
# shell on the crest could never reach men below the lip (S3b T9: 0 kills
# in 5b). 150 cm: about the parapet's back slope into a 1.5 m trench
# (cm; 0 turns it off).
frag_fall_probe_cm = 150

# Suppression details (the thresholds and decay are the [combat] keys
# above). S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[combat.suppression]
# A near miss on a man crouched below cover (in a trench, off the fire
# step) adds this share of the weapon's suppression (percent). S3b: 50 ->
# 100. The trench already protects by geometry (only rounds passing over
# the lip or striking the parapet near him count, and they cannot hit
# him); halving the suppression too made a trench line unpinnable (Gates
# of Hell: men in a trench still duck under heavy fire). Measured in
# fortify-test (MG suppressing, rifles from 150 m): 50 -> defenders ducked
# 12 %, 100 with the duck keys below -> ducked 61 %, pinned 29 %.
covered_near_miss_pct = 100
# A burst with earth between it and a man suppresses him this much
# (percent).
blast_behind_cover_pct = 50
# Each point of suppression widens a shooter's spread by this many
# hundredths of a percent (100: 1 % per point; pinned men use
# pinned_spread_pct instead).
spread_per_point_pct = 100
# S3b duck state (docs/slices/S3b-balance.md B1; owner 2026-11-01: keep
# the pinning fire, informed by Gates of Hell, where men in a trench keep
# their heads down under heavy fire and stop returning it). A man in a
# trench or crater at or above duck_points ducks below the lip: no fire,
# no throw, the crouched capsule. He comes back up only below
# duck_release_points. Both (and pin_suppression) are scaled by the squad
# type's steadiness_pct (all 100 now). Only real rounds, fragments and
# bursts fill the meter (physical-contact rule). The spec's 35 / 20
# (points) assumed an MG 42 on a 25 m line gave about 3 near misses a
# second per man (15 points x 50 % covered = ~24 points/s against a decay
# of 8); covered_near_miss_pct is now 100 (S3b-25), see below; a rifle
# squad alone (1-2 points/s per man) does not keep a line ducked. Open ground is
# unchanged (owner question S3b-3 (A)). Measured (Part B): an MG 34/42 at
# 150 m on a 30 m line gives each man only ~0.5 near misses a second (wide
# MG spread, grazing fire into the ground in front), so 35 / 20 ducked a
# line 12-17 % of the time; 25 / 10 with the slow decay below: ~60 %.
duck_points = 25
duck_release_points = 10
# A ducked man's suppression decays at this share of
# suppression_decay_per_s: he keeps his head down until the fire slackens
# (Gates of Hell feel), so a steady MG keeps a line down once it is down
# (%). 25: a ducked man comes up about 6 s after the last near miss from
# 25 points, instead of 2 s.
duck_decay_pct = 25

# The Suppress order (S3b, docs/slices/S3b-balance.md B2; owner 2026-11-01,
# after Gates of Hell's 2025 "suppression fire" order): men and vehicles
# hold and fire real rounds at a point or short line without a spotted
# target. Each shot aims at a random point on the line (counter RNG keyed
# by shooter and shot count), this high above the ground there.
[combat.suppress]
# Rounds below the parapet crest (~0.3 m) stop in it short of the men and
# rounds more than ~1.6 m over a crouched man's head pass without a near
# miss, so the aim sits in that band. Part B measurement: 30 cm put half
# of an MG's rounds into the ground in front (grazing fire from a prone
# gun); 80 cm raised near misses per round by ~60 %, 120 cm by less (cm).
aim_cm = 80
# Longest line one order covers: about two squad frontages (m).
line_max_m = 40
# A shot needs a clear line from the muzzle to a point this far short of
# its aim point (one ray per shot); else it is not fired. 300 cm: a round
# aimed over a parapet whose crest stands ~1-2 m in front of the line
# still goes (cm).
clear_cm = 300
# A vehicle on Suppress fires its main gun's HE at the line at most every
# tank_he_s seconds while more than tank_he_reserve HE rounds are left
# (owner question S3b-2 (A): tanks spend real HE, with a reserve). 12 s:
# a deliberate rate, about a fifth of the gun's; 6 rounds kept for
# targets the gunner picks himself.
tank_he_s = 12
tank_he_reserve = 6
# The HE is aimed this high above the ground at the line's middle: 0, so
# the shell bursts on the parapet or in the trench; aimed at aim_cm it
# flies over a flat trench line and bursts behind it (cm).
tank_he_aim_cm = 0

[combat.share]
# S5a: sharing rounds inside a squad (infantry-structures.md 6). One pass per
# squad this often (s); a man below below_pct of his own load takes
# share_pct of the giver's load from the squadmate within reach_m above
# giver_above_pct (ammo bearers, then assistants, then the rest), never
# above his own load. A dry crew weapon (MG, mortar) takes a magazine from a
# squadmate within crew_feed_m at once (owner question S5a-6 (A)).
interval_s = 5               # s
reach_m = 10                 # m
below_pct = 25               # % of his own load
giver_above_pct = 50         # % of the giver's own load
share_pct = 20               # % of the giver's own load per pass
crew_feed_m = 5              # m

# S5a fire discipline (infantry-structures.md §6.2; S5a-4, S5a-18 (A)): in
# the default "discipline" mode a man opens fire only at targets within
# hold_beyond_pct (%) of his weapon's range (rifles 210 m of 300); a
# Suppress order and the "at will" mode fire to full range. In "hold" mode
# a man fires only at enemies within hold_open_m (m), or once a squadmate
# fired or was suppressed to hold_spring_points (points, as
# crouch_suppression; 0: own fire only): the squad springs to discipline.
# Single-shot AT items and launchers in hold fire by their own rule
# (engage_moving at a moving vehicle, engage_still at a stopped one;
# S5a-30 (A)). Reasoning: unaimed fire beyond effective range wastes the
# rounds a man carries (FM 7-10 / German Schiessvorschrift fire control,
# summarised in infantry-structures.md). hold_spring_points = 70 (the
# pin_suppression level, S5a Fix review H1): a hidden ambush party keeps
# its fire under the near misses of a tank's MG raking the area and gives
# itself away only when pinned, as the drill (hold until the leader
# opens fire) asks; at 30 the ambushes sprang on stray fire.
[combat.fire]
hold_beyond_pct = 70
hold_open_m = 30
hold_spring_points = 70

# Cover on arrival: each man moves his slot to the nearest free trench spot,
# else (an enemy seen) to a spot with terrain between him and that enemy.
# S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[cover]
# Men look for cover this far from their line slot (m).
radius_m = 10
# Only enemies this close to the goal count for terrain cover (m).
enemy_m = 400
# Two men's cover spots keep at least this far apart (mm).
gap_mm = 1200
# A trench spot needs dug ground this far around it too, so a man who stops
# near it still stands in the trench (mm).
trench_margin_mm = 400
# Enemy eye height and the covered man's chest height for cover rays (mm).
eye_mm = 1500
chest_mm = 1000

[items]
# A soldier in his own base gets one item back this often, up to his
# loadout.
resupply_s = 20
# S4: a squad fires at most one single-shot AT item (Panzerfaust) this
# often (s), so it does not empty its kit at one tank.
single_shot_gap_s = 3
# S4 review L5: a fallen gunner's crew weapon (MG, launcher) goes only to
# a man of his squad within this distance of it (m); farther men (a
# detached assistant across the map) do not get it instantly. 30 m is a
# squad's spread in open order (about 10 men at 3 m).
crew_pickup_reach_m = 30
# S11b G1 switch (docs/slices/S11b.md 2): squads are issued their rifle
# grenades (0: the setup drops the rifle_grenade kind from every squad type;
# 0..1). Build C turns it on (ablation rg_off).
rifle_grenades = 0
# S11b G3: a squad fires at most one rifle grenade this often (s; plan value,
# S11b-13; 0..600).
rifle_grenade_gap_s = 15

# Thrown items. S3b: moved from the sim's Rust constants unchanged (same values);
# docs/modding/tuning.md lists every table.
[items.throw]
# The item leaves the hand this far below the top of the firing capsule
# (mm).
release_drop_mm = 150
# Shortest flight: a satchel dropped at the feet still arcs (ms).
min_flight_ms = 300
# Lob steepness: tangent of the launch angle over flat ground, in
# thousandths (1000 = 45 degrees).
lob_tan_milli = 1000
# A smoke cloud reaches this far below its centre (a sight line along a
# slope) (mm).
smoke_below_mm = 2000

[vehicles]
# S3 (docs/slices/S3-armour.md). Vehicles can be called in from 4:00 of
# match time, at most 4 alive per player (S3b: no call-in queue any
# more; each vehicle def adds its own re-call cooldown). Tests use the override
# in mods/ww2/tests/rules_test_unlock.toml (unlock_s = 0).
unlock_s = 240
limit = 4
# Most wrecks on the map; beyond it the oldest is removed.
wreck_cap = 32
# A crewman moving into an empty driver or gunner seat.
seat_swap_s = 4
crew_hp = 100
# A crewman below this is wounded (role penalties, see the slice).
wounded_hp = 50
# Faster than 1 m/s counts as moving (spotting, spread, launcher fire
# discipline).
moving_cm_s = 100
# Sight range against a moving vehicle (the size factor is the vehicle's
# spot_size_pct, 300 % after firing is the gun's; the highest applies).
moving_spot_pct = 250
# Enemy soldiers this close spot a vehicle without a sight line (engine
# noise and size).
near_spot_m = 25
# Gunnery: spread against a target faster than 1 m/s; each further shot at
# the same target 20 % tighter down to 50 %; HE at infantry uses a wider
# area spread and is never fired within 30 m of own men. S3b: the gunner
# aims at the centre of the target's visible mass (aim_hull_margin_pct,
# "the weakest plate", is gone). S3b Tune (owner question S3b-21 (A)):
# moving_target_spread_pct 300 -> 600. The lead estimation error alone
# barely misses a 5.8 m long crossing hull at 300 m (case 3d 86-91 % of
# stationary); 500 gave 65 %, 550 60 %, 600 55 % (target <= 60 %). It
# stands for the tracking and range-estimation errors against a mover
# that the model does not simulate; wartime first-round hit rates on
# moving tanks were roughly half of those on still ones. S3b Fix (review
# M2): the extra (600 - 100 %) scales with the share of the target's
# speed across the line of fire (|sin| of the angle), so a tank driving
# straight at the gunner gets none and a crossing one all of it.
moving_target_spread_pct = 600
ranging_step_pct = 20
ranging_floor_pct = 50
he_area_spread_mrad = 6
he_clear_m = 30
# Trench crossing: a track sample over ground dug 1.0 m or more caps speed
# at 1 m/s; a new crossing (one bog roll) starts after 2 s with none.
crossing_dug_cm = 100
crossing_speed_cm_s = 100
crossing_gap_s = 2
# Fire: an engine hit for 40+ starts one with 30 %. It burns the engine at
# 5 HP/s; every 4 s a living crew puts it out with 25 %; after 20 s it
# knocks the vehicle out.
fire_min_damage = 40
fire_start_pct = 30
fire_burn_hp_s = 5
fire_check_s = 4
fire_out_pct = 25
