# Skirmish rules (docs/slices/S1-skirmish.md "Economy", "Victory", "Capture").
id = "ww2:skirmish"
name = "Skirmish"
tick_hz = 30
hash_interval = 30
tickets = 500
# Soldiers per side, alive or called in.
pop_cap = 120
projectile_cap = 2048

[economy]
start_manpower = 600
income_per_min = 240
# Extra income per held capture point.
point_income_per_min = 60

[tickets_drain]
# Per point of difference in held points.
per_min_per_point = 20

[capture]
radius_m = 15
time_s = 20
# Capture speeds up with each man up to this many.
max_men = 4

[movement]
# Path cost multiplier per 100 % grade: cost = base * (100 + grade_pct * slope_cost_pct / 100) / 100.
slope_cost_pct = 300
# Grid steps steeper than this are impassable.
max_slope_pct = 80
arrive_cm = 40
retreat_speed_pct = 140
# Members behind their formation slot walk this much faster.
catch_up_speed_pct = 125
# A man ordered prone crawls at this much of his walking speed.
prone_speed_pct = 30
# A* node expansions per tick (all players), and per single search.
path_budget_per_tick = 4000
path_max_expansions = 8000
# Steps between two trench cells cost this much of a normal step, so squads
# already in a trench line prefer to follow it.
trench_cost_pct = 60

[dig]
depth_cm = 160
floor_cm = 80
parapet_cm = 30
max_length_m = 60
# Work points per metre of trench. One man at dig_rate_pct = 100 does 100
# work points per second: a rifle squad digs 20 m in about 3.5 min.
work_per_m = 8400
# The trench deepens in this many equal passes (each pass is visible).
passes = 8

[combat]
# Spotting: LOS rays per player per tick, and how often each enemy soldier
# is re-checked while the budget lasts. Each check tries the nearest few
# observers in range (one ray each).
spot_rays_per_tick = 160
spot_period_ms = 200
spot_observers = 2
# Sight range against prone, entrenched, wooded and firing targets (percent
# of the observer's sight; a recent shot replaces the other three).
prone_spot_pct = 50
trench_spot_pct = 60
woods_spot_pct = 50
firing_spot_pct = 150
reveal_ms = 2000
# Suppression, in points out of 100: rounds passing within near_miss_cm add
# the weapon's `suppression`, a hit adds hit_suppression. Soldiers crouch at
# crouch_suppression and are pinned (prone, no movement, worse aim) at
# pin_suppression.
near_miss_cm = 200
hit_suppression = 25
suppression_decay_per_s = 8
crouch_suppression = 30
pin_suppression = 70
# Accuracy: weapon spread is scaled while moving and while pinned, and grows
# linearly with range up to range_spread_pct extra at full range.
moving_spread_pct = 250
pinned_spread_pct = 200
range_spread_pct = 50
# A man firing from a trench stands on the fire step, this much above the
# parapet.
fire_exposure_cm = 30
corpse_s = 30

[items]
# A soldier in his own base gets one item back this often, up to his
# loadout.
resupply_s = 20

[difficulty.easy]
income_pct = 80
reaction_ms = 4000
replan_ms = 3000
decision_quality_pct = 50

[difficulty.normal]
income_pct = 100
reaction_ms = 2000
replan_ms = 2000
decision_quality_pct = 80

[difficulty.hard]
income_pct = 125
reaction_ms = 1000
replan_ms = 2000
decision_quality_pct = 100

[ai]
# Squads below this strength (percent of their full men) fall back to base
# while enemies are near.
retreat_strength_pct = 40
# Spotted enemies this close to a point or squad count as a threat to it.
threat_radius_m = 80
# Target army mix by squad role, in percent of squads.
mix_rifle_pct = 50
mix_mg_pct = 20
mix_engineer_pct = 15
mix_mortar_pct = 15
# Rounds per mortar barrage order.
barrage_rounds = 6
# Engineers dig a trench this long at each held point, this far in front of
# it toward the nearest enemy.
dig_length_m = 20
dig_offset_m = 10
# A squad throws at most one item (frag, smoke, satchel) this often.
throw_cooldown_s = 10
# Frags go at spotted enemies in a trench, or at a group of at least this
# many men within 5 m of each other.
frag_group_men = 3
