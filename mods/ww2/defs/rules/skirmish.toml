# within this long of the previous penetration is abandoned (s): "disabled
# under fire", the second penetration tells the crew they are a target.
under_fire_s = 10
# A crewman below this many HP is wounded (HP of crew_hp 100) ...
wounded_hp = 50
# ... and takes this share of his hatch's exit time (%). 150: a starting
