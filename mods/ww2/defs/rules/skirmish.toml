# captures (vehicles.recrew.capture, capture_needs_crew). Else it walks back
# as in S3c. 0 turns it off; default on unless the faction wins move by more
# than 5 points (S4-7 (A)).
# S4 Tune: 150 -> 300. At 150 m the AI gave 9-23 capture orders in 160
# matches and 1-3 captures; at 300 m 133 orders and 7 captures (4.4 % of
