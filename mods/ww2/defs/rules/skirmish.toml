detect_cm = 150              # a sweeper finds a mine this close (R8; 7.6 "1.5 m")
detect_pct_per_s = 50        # % chance per second per mine within detect_cm (R8; verify)
sweep_speed_pct = 25         # % of walking speed while sweeping (R9; verify)
lane_max_m = 50              # longest ClearMines lane (R9; verify)
lane_half_cm = 200           # half width of a swept lane (R9; verify)
lift_s = 20                  # s to lift one found mine at 100 % (R11; verify)
demolish_place_s = 10        # s to place a demolition charge (R19; verify)
demolish_fuse_s = 10         # s from placing to the burst (R19; verify)
demolish_pct = 300           # % of the charge's damage the demolished piece takes, tamped (R20; verify)
