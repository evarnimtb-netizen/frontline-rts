mine_band_foot_cm = 300      # a foot step this close to a known enemy AP mine is priced
mine_band_vehicle_cm = 400   # a vehicle step this close to a known enemy AT mine is priced

# % work rates by tier (7.7: assault clears fast, construction builds fast, clears slow).
[fortify.tiers]
field = { build_pct = 100, cut_pct = 100 }
assault = { build_pct = 0, cut_pct = 200 }
construction = { build_pct = 150, cut_pct = 50 }
