# within recrew_reach_m (m). Otherwise crews walk back to base.
recrew_clear_m = 80
recrew_reach_m = 300
# S3c denial (S3c-9 (A)): a tank with no live target fires at an enemy
# abandoned tank within deny_m (m) in view, while capture is on (so the
# enemy cannot take it back). 0 turns it off.
deny_m = 300
# S4 AI capture (S3c-33 (A)): a crew squad whose tank is gone captures an
