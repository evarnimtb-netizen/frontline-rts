material_reach_m = 15        # m: builders draw from an own construction crate or truck this close (7.1)
carry_kg_per_man = 20        # construction kg one man carries (verify; 7.1 "each engineer carries some")
construction_mp_per_t = 100  # MP per t at base (verify; owner D1: every kg priced once, at base)
shot_piece_damage = 150      # hp a non-bursting main-gun round takes from a piece (= supply.shell_box_damage)
# S10b (docs/slices/S10b-obstacles.md rules table R8-R21; "verify" = no design figure).
