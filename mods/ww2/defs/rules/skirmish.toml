vehicle_clear_m = 6          # no minefield, obstacle or bunker site this close to a vehicle hull (R18; verify)
# S10b-ai (docs/slices/S10b-ai.md R11): paths avoid enemy mines the player knows.
mine_paths = 1               # switch: price steps near known enemy mines (foot: AP, vehicles: AT)
