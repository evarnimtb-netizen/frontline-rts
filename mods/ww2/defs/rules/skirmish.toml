# close can reach the point in under a minute. S3b Tune: 250 -> 400
# (T7): at 250 rockets were fired in 6-7 of 10 matches (normal bases);
# at 400 in 8 of 10, with the AI still holding AT teams back from tanks
# beyond a point's reach (A/B, seeds 1-10 both bases).
at_hunt_m = 400
# S3c Tune: at_hunt_clear_m 40 -> 20. With 40 m an AT team would not leave
# for a tank while any enemy soldier stood near its route (rifle squads
# at every point), so after the shell-lifetime fix (S3c-26) it often sat
# while tanks shelled the point from 160 m. 20 m (grenade range: a
# stalking team goes round the men, not through them) over 160 matches
# (seeds 1-80 x both bases): rocket knock-outs 6.9 -> 9.7 % of tank
# losses (51 -> 71), rockets fired 396 -> 445, matches with a rocket 70 -> 75
# %, wins by faction 66/94 -> 76/84, base 0/1 wins 84/76.
at_hunt_clear_m = 20
at_hunt_inset_m = 10
# Engineers with a satchel go for a known enemy vehicle within
# satchel_hunt_m that has been slower than ai.infantry.satchel_slow_mm_s
# (stopped, bogged, immobilised) for satchel_slow_s; the throw rule fires
# within the satchel's range (m, s). They walk to a spot satchel_stand_m
# outside the hull side nearer them (5 m: the satchel lands ~0.8 m off the
# hull, so the thrower stands ~4 m from it, inside the 3-8 m throw range).
# S3b Tune: satchel_hunt_m 60 -> 150 (T7): AI tanks halt 40-160 m from
# enemy points, so at 60 m a hunt rarely started; at 150 engineers in the
# trench go for a tank halted in front of it.
# S3c Tune: 150 -> 250. Since the shell-lifetime fix tanks halt at the
# 160 m tank_standoff_m from a point with AT seen, and the engineers dig in
# 10 m in front of it, so a halted tank stood just outside 150 m. Satchels
# thrown at vehicles in 160 matches (seeds 1-80 x both bases): 1 at 150 m;
# 10 at 250 m (7 normal-base matches); 5 at 250 m together with the
# at_hunt_clear_m of 20 below (5 normal-base matches); 6 at 350 m, so 250.
# Most hunts still end with the carrier shot on the approach (case 8:
# engineers lose 100 of 100 against live MGs).
satchel_hunt_m = 250
satchel_slow_s = 3
satchel_stand_m = 5
# S3c sticky hunts (S3b-36 (A), docs/slices/S3c-armour.md B2): a hunt keeps
# its vehicle while it was seen within satchel_stick_s (s; the squad goes to
# its last seen position), has not been faster than satchel_slow_mm_s for
# more than satchel_chase_s (s; a tank stopping and starting stays hunted),
# is within satchel_hunt_m + satchel_leash_m (m) of the squad, and for at
# most satchel_hunt_max_s (s). Hunters crouch on the approach and crawl
# within satchel_crawl_m (m) while the tank's hull MG arc covers them
# (tank-hunting drill: close in the MG's dead ground, crawl the last
# stretch; 0 turns crawling off). Baseline: 96 hunts gave 1 throw, 45 were
# dropped with the target still there.
satchel_stick_s = 20
satchel_chase_s = 6
satchel_leash_m = 50
satchel_crawl_m = 25
satchel_hunt_max_s = 120
# S3c second base of fire (S3b-41 (A), S3c-11 (A)): an assault with at least
# three squads gets a second base (an MG team, else a rifle squad) when the
# first base's fire weight (rounds/min x suppression over its men) is under
# second_base_below_pct (%) of the enemy's strongest MG team weapon, from a
# spot at least second_base_gap_m (m) from the first. M1919A4 500 x 14 =
# 7,000 vs MG 42 1,200 x 15 = 18,000: US assaults get two bases, German one.
second_base_below_pct = 100
second_base_gap_m = 30
# S3c rockets (B3, only because T2 stayed under 20 % after Part A): AT teams
# also hunt an immobile or bogged enemy tank within at_hunt_stuck_m (m; a
# stuck tank cannot turn away, so a longer stalk pays), and an AT team with
# no hunt follows an own tank on an assault within at_follow_m (m),
# at_follow_back_m (m) behind it (tank-infantry teams: the bazooka and
# Panzerschreck teams went with the armour to meet counter-attacking tanks).
# 0 turns either off. Measured one at a time (80 matches, seeds 1-40 x both
# bases, Part B code): with following on (150 m), rockets knocked out 33 of
# 233 tanks (14.2 %); with it off 48 of 243 (19.8 %) and 260 rockets fired
# instead of 216: AT teams trailing their own tanks are not at the points
# the enemy tanks come to. So following is off. The stuck-tank stalk made 3
# hunts in 80 matches and no measurable difference (36 vs 33 rocket
# knock-outs off/on); kept, as a stuck tank is the realistic target.
at_hunt_stuck_m = 500
at_follow_m = 0
at_follow_back_m = 30
# S4 Panzerfaust hunts: a squad carrying a single-shot AT item goes for a
# known enemy vehicle within pzf_hunt_m (m) of it, to a spot inside the
# item weapon's engage_still, unless a known enemy soldier is within
# pzf_clear_m (m) of its route's middle. Starting values (spec). 0 turns
# the hunts off (the men still fire at vehicles that come into range).
pzf_hunt_m = 100
pzf_clear_m = 40
# S5a Panzerfaust ambush hold (S4-42 / T12; docs/slices/S5a-ammo.md "AI"
# step 5): instead of hunting into the escort's MG fire, a squad carrying
# Panzerfausts that sees an enemy vehicle within ambush_watch_m (m) of its
# point or itself waits in cover beside the vehicle's projected path,
# ambush_offset_m (m) to the side, prone and holding fire; the carriers
# fire by the Panzerfaust's own rule (engage_moving 40 m at a moving
# vehicle, engage_still 60 m at a stopped one; S5a-30 (A)) and the squad
# springs to discipline with the first shot ([combat.fire]
# hold_spring_points). Gives up after ambush_max_s (s). The ambush ends as
# "gone" only once the vehicle is seen beyond ambush_release_m (m; at least
# ambush_watch_m): S5a Fix (review M1), with release = watch 81 % of 1,836
# ambushes on 160 matches ended "gone" at the edge of the watch and
# restarted.
# Reasoning: Panzerfaust drill was the close ambush from cover (Rottman,
# "Panzerfaust and Panzerschreck", 2014); starting values from the spec,
# release 1.5 x watch (review M1).
ambush_watch_m = 200
ambush_offset_m = 25
ambush_max_s = 90
ambush_release_m = 300

# S5a: the AI's ammunition reserve and refill trips (docs/slices/S5a-ammo.md
# "AI" steps 1-4). The base is the only source in S5a (no crates until S6).
[ai.ammo]
# A squad below this share (%) of its main feed (the crew weapon's belts,
# else its men's main weapon) with no known enemy within threat_radius_m
# walks back to refill ...
return_below_pct = 30
# ... below this share (%) it goes even under threat (as a retreat).
dry_pct = 5
# At most this share (%) of the squads at one point leave to refill in one
# plan, the lowest first (at least one); a point's last squad holds unless
# it is dry ("send dry squads back in turns", Appendix A.5).
max_returning_pct = 34
# A refilling squad leaves the base at this share (%) of its load ...
refill_full_pct = 90
# ... or after this long (s) in the base.
refill_max_s = 120
# A mortar barrages only while it holds more than this share (%) of its
# bombs, unless an enemy is near an own point (keeps a reserve for defence).
# S6b: 0 (was 30). Held tubes had ~2.4 bombs on average while crates came;
# with crate runs at 90 % the tube fires its last bombs and is refilled
# (160 set: bombs fired +10-20 per match; S6b-mortar-ai.md). A mission
# still needs 2 bombs (ai::mortar::MIN_BOMBS).
mortar_reserve_pct = 0
# Manpower (MP) kept back from unit buys while an own unit waits in base
# for a paid refill (so the refill is not starved by buys).
float_mp = 100
# A unit whose refill paused for lack of manpower leaves the base after
# this long (s) (S5a-20 (A): the shell budget waits for S6).
rearm_stall_s = 15

# S5b: the AI's fire missions (docs/slices/S5b-mortars.md "AI mission
# logic"; spotters and map fire are used from S5b Part B).
[ai.mortar]
mission_rounds = 6           # rounds per AI mission (was ai.barrage_rounds)
spot_samples = 16            # most sight-line rays a mortar squad casts per plan looking for a spotter spot (16 spots, up to 3 targets)
spot_max_s = 60              # s: a spotter who has seen nothing this long after reaching his spot comes back (3x if he never gets there); a recalled one blocks a new spotter this long
spot_hold_s = 30             # s: a spotter with no new target stays this long before rejoining
map_fire_min_pct = 60        # %: map fire only while the mortar holds more than this share of its bombs
map_fire_min_score = 40      # and only at a target scoring at least this (still men*10 + moving men*5 + men in trenches*20)
map_fire_max_miss_m = 20     # S6b: m: and only where the map start error at that range (max(8 % of range, 27 m) here) is at most this: 20 m -> no AI map fire on these tables (AI map bombs landed ~36 m off and killed almost nothing; S6b-mortar-ai.md); a player can still order it

# Where a bought squad spawns (S3b, owner 2026-11-01: a call-in spawns at
# once in the base, no queue and no delivery time).
[call_in]
# Six spots on a ring at this share of the base radius (%), the seventh
# the base centre. 50: the S1 spawn ring (base radius 40 m -> 20 m), so an
# 8-man line (21 m wide) stays inside the base.
spawn_ring_pct = 50
# Each squad tries its own spot first (squad id mod 7); a spot with men or
# vehicles within this distance (m) is passed over for the least crowded
# one. 10 m: about half an 8-man line, so a squad still standing on its
# spot is seen, while the 20 m between ring spots stays clear.
spawn_clear_m = 10
# A vehicle counts as this many men when comparing spots (a 6 x 3 m hull
# covers the ground of about a whole squad).
spawn_vehicle_weight = 8
# S4: the match month ("YYYY-MM") for unit cards' available_from /
# available_to; a card outside it leaves the roster. Empty: no date filter
# (skirmish fields every card).
date = ""

# S4: the training profile (defs/training/) of unit cards that name none.
[training]
default = "ww2:training_regular"

# S4: named limits on alive units per player, "<group id>" = most alive; a
# unit card joins one with limit_group (all its cards' alive units count).
# None in ww2 yet: vehicles keep the [vehicles] limit.
[limit_groups]

[supply]
# S5a (owner decision D1, 2026-11-01): no free ammunition anywhere, the base
# included. Prices per supply kind in manpower per tonne (whole numbers,
# owner question S5a-1 (A): 200 per t = 0.2 per kg), charged round by round
# as each round goes into a man's pouches, an AT team's launcher or a
# vehicle's rack in the own base. With no manpower the refill pauses and
# resumes when income arrives (nothing goes into debt).
small_arms_mp_per_t = 200    # MP per t: rifle, SMG, pistol, MG rounds, vehicle MG belts
explosives_mp_per_t = 500    # MP per t: grenades, satchels, AT rockets, Panzerfausts
shell_mp_per_t = 1000        # MP per t: mortar bombs (S5a base refill only), tank main-gun rounds
# D4: a full main-gun rack refill costs at most this share of the vehicle's
# card (%); the rack factor is the lower of rack_rearm_price_pct and that
# ceiling (Panzer IV 53 %, Sherman 51 % at these prices).
rack_refill_max_card_pct = 75
rack_rearm_price_pct = 100   # % of the shell price for main-gun rounds (fallback lever)
# D3: rare rounds (APCR, HVAP: ammo defs with rare = true).
rare_cap_max = 10            # rounds: the most any vehicle def may hold (rare_cap)
rare_rearm_base_s = 10       # s: one rare round per this in base (standard: vehicles.base_rearm_s)
# Base refill rates per man in his own base (the base is the only supply
# source in S5a; HQ, dumps and crates come with S6).
base_small_arms_rounds_s = 30   # rounds per s per man (most depleted small-arms feed first)
# S6 (owner Q4, S5a-42): the base refills no mortar bombs (0); they come
# only in crates, from an HQ or a dump. S5a had 4 s per bomb per man.
base_bomb_s = 0
# S5a Fix (review M2): no bomb goes into a mortar squad in base until this
# long after its mortar last fired (s; 0: no wait). Brakes the base battery
# (artillery-on-map.md §4.10): without it a mortar parked in base fed 0.75
# bombs/s against its 0.25 bombs/s rate of fire and never ran dry, while a
# mortar at the front walks 300-500 m back after 15 bombs (about 2-3 min).
# Measured on 160 AI matches (seeds 1-80 x both bases, S5a log "Fix"): 120 s
# halves the bombs refilled (28,000 -> 14,000 for Germany) and base 1 wins
# 98 of 160 (61 %, T2 limit 62 %); 60 s: 94 of 160. The AI's mortars support
# points near their own base from inside it, and the map gives the two bases
# different near points. Off (0) in S5a by S5a-42 (A): S5b's FireMission
# and observer rule decide the base battery, measured against this lever.
base_bomb_after_fire_s = 0
# S11a1 G7 (owner S11a1-2 (A)): 1 = an infantry gun rearms in the own base at
# the shells price, as an AT gun; 0 = HQ, dump and truck only (S11a2 default).
arty_base_rearm = 1
# Items and AT rockets keep [items] resupply_s, now priced.
low_pct = 30                 # %: HUD "low" marker below this share of a squad's load (Part B)
# --- S6: HQ, dumps and crates (docs/slices/S6-hq-crates.md "Sim rules";
# owner Q2 (C) the HQ fills only by carried crates, D1 every kg priced once
# at base (crate kg x the kind's price above), D2 no distance surcharge,
# D3 forward rearm rates) ---
crate_feed_m = 5             # m: a crate this close feeds a mortar's gunner, men or a tank
base_crate_issue_s = 10      # s: one crate issued per player per this in the own base
crate_cap = 12               # live crates per player (carried or set down) ...
shell_crate_cap = 8          # ... of which shells crates
hq_max = 1                   # HQs per player (built or digging)
dump_max = 3                 # dumps per player
structure_bomb_s = 2         # s per bomb into a mortar squad inside an HQ or dump radius
crate_bomb_s = 4             # s per bomb from a shells crate within crate_feed_m of the gunner
fwd_rearm_s = 4              # s per standard main-gun round forward (D3)
rare_rearm_fwd_s = 30        # s per rare round forward, up to rare_cap (D3)
serve_men = 6                # men served per source per service ...
serve_period_ms = 500        # ... one service per this (ms)
unfired_s = 3                # s: a man is served once he has not fired this long
bullet_box_damage = 4        # hp a rifle-calibre bullet takes from a box (S6-5 (A))
shell_box_damage = 150       # hp a main-gun round that does not burst takes from a box
                             # (below the HQ stock's 400 and the dump's 250: one AP
                             # round holes a stack of ammunition boxes, it does not
                             # destroy it; a 60 hp crate breaks, review S6 F1)
cookoff_kg_per_burst = 16    # kg: one cook-off burst per this (S6-10 (A)) ...
cookoff_max = 8              # ... at most this many ...
cookoff_s = 6                # ... spread over this (s)
pickup_m = 2                 # m: an own man this close picks up a crate
# --- S8b: supply vehicles (vehicles.md 7.3; docs/slices/S8b-trucks-recon.md 7) ---
fwd_mg_rounds_s = 50         # MG rounds per s into a vehicle's stowage from any forward stock (the 7.3 row S6 left out, S8b-6)
truck_load_kg_s = 8          # kg per s of small arms or explosives into a truck stopped in its own base (shells: base_crate_issue_s per crate of kg)
drop_s = 3                   # s per crate off a truck
drop_reach_m = 8             # m: a truck this close to its drop point stops and drops there
cargo_detonate_min_kg = 40   # kg of shells + explosives in the cargo for a hit to detonate it (S8b-9); below this it only burns

# S6: the AI's HQ, crate runs and supply to tanks (owner request
# 2026-11-01: bring supply to a tank, not only drive it back).
[ai.supply]
hq_behind_m = 120            # m behind the most valuable held point, toward the own base
hq_probe_rays = 8            # candidate HQ spots tested per plan (reverse-slope rays)
crate_run_below_pct = 90     # %: a mortar or the HQ below this gets a crate run (S6b: was 50; tubes sat near dry a quarter of the time waiting for a run that started at half)
tank_crate_below_pct = 25    # %: a tank this low that cannot reach a source gets a crate
tank_crate_far_m = 300       # m: ... "cannot reach": immobile, or (not on a rearm trip)
                             # farther than this from the base and every built HQ/dump
                             # holding shells for ten of its rounds; such a tank holds
                             # for bearers taking crates at the base instead of driving back
                             # (straight line; about 75 s each way at a tank's 4 m/s
                             # off-road, the length of a mortar crate run; review S6 F3)
shell_mp_max_pct = 25        # %: at most this share of income goes on crates
hq_after_s = 60              # s: the AI buys its HQ squad after this
dry_walk_s = 120             # s: a dry mortar with no run walks to the HQ or base
mortars_per_bearers = 2      # S6b: one bearer squad per this many own mortar squads (rounded up, at least one; 0: one squad as in S6). Tubes sat near dry (~2 bombs) a quarter of the time with one squad running crates (S6b-mortar-ai.md)

# S8a (docs/slices/S8a-halftracks.md 7): how the AI uses its half-tracks.
# Load a squad at the base, ride toward its objective, get off out of sight
# of known enemies (or at once when hit), support with the MG from
# overwatch, return for the next squad. Starting values.
[ai.transport]
min_ride_m = 200             # m: a squad rides only to an objective farther than this; a ride this long counts as "transported" (report). S8a Tune: 150 -> 120 (USA 0.86 -> 1.12 transported per match, saved time per ride still +30 s); S8b 120 -> 200 with drop_short_m 30 (rides this long pay: Germany -6 -> +8, USA -3 -> +19 s on the 40 set)
wait_s = 10                  # s: the vehicle waits at most this long past the squad's walk to the door, then goes to support alone. S8a Tune: 30 -> 20; S8b 20 -> 10
dismount_back_m = 40         # m: the men get off this far short of the first point on the way ...
dismount_sight_m = 150       # m: ... within this of a known enemy with a clear line. S8b 300 -> 150 (about rifle range)
los_rays = 8                 # sight-line rays per check along the way (0: distance only)
hit_s = 2                    # s: a penetration this recent counts as "hit": everyone out
rider_suppression_pct = 50   # %: a rider suppressed past this gets everyone out (the crouch threshold)
stuck_s = 10                 # s: stopped this long on the way: the men get off where it stands
support_s = 15               # s: after unloading, the MG supports from overwatch this long before it goes for the next squad. S8a Tune: 60 -> 30 (many half-tracks were lost before a second trip); S8b 30 -> 15
arrive_m = 15                # m: a move that ends farther than this from its goal is a failed move ...
max_fails = 2                # ... and after this many the job uses where the vehicle stands (no move loops, S7 tick fix)
repath_s = 5                 # s: no job sends the same move again within this
pick_m = 400                 # m: S8b: squads this close to the vehicle may be picked (S8b-15: 250 start, 400 for USA trips per bought >= 1)
meet_ahead_m = 30            # m: S8b: the vehicle meets a farther squad this far ahead of it, on its way to its point
meet_stand_m = 20            # m: S8b: the squad boards when the vehicle stands this close (else it keeps walking)
drop_short_m = 30            # m: S8b: the ride ends this far short of the point; the men walk the rest. Was dismount_back_m + 20 = 60 (spent 50 s on foot per ride)
unload_rolling = 1           # S8b: 1: the unload is ordered on arrival, while it still rolls; 0: once stopped
counted_ride_m = 120         # m: S8b: a ride this long counts as "transported" (report only: the S8a value, kept while min_ride_m picks longer rides)
ride_lock_s = 60             # s: S8b: after getting off a squad keeps going to the point it rode for, unless enemies are near

# S8b (docs/slices/S8b-trucks-recon.md 9): armoured cars scout ahead of the
# infantry on their own share of the income, so they never take a tank's buy.
[ai.recon]
after_s = 90                 # s: first car from this match time ...
second_after_s = 720         # s: ... a second one from this
income_max_pct = 12          # %: all its cars cost at most this share of the income so far. S8b-17 start 8 bought the first car only after about 12 minutes
view_back_m = 200            # m: it observes from this far short of the point the infantry goes for
at_threat_m = 200            # m: a known AT team, tank or tank destroyer this close makes it back off ...
backoff_m = 60               # m: ... this far per order

# S8b: supply trucks, on their own share of the income.
[ai.truck]
min_vehicles = 2             # fighting vehicles alive before it buys one truck ...
hq_wait_s = 300              # s: ... and the HQ stands or this much match time has passed
income_max_pct = 9           # %: truck cards cost at most this share of the income so far. S8b-17 start 5 meant the 12th minute
load_shells_kg = 160         # kg: shells it loads, at most the def's load_kg (half a load: 160 MP, the crate budget [ai.supply] shell_mp_max_pct limits it)
load_wait_s = 90             # s: it waits in base this long for that load ...
min_load_pct = 40            # %: ... and leaves with at least this share of it
follow_m = 150               # m: it waits this far behind the centre of the armour (vehicles.md 7.5 supply_follow_m)
los_rays = 8                 # sight-line rays per spot tested (0: no line test)
return_below_pct = 20        # %: under this share of its load it goes back to the base
flee_m = 120                 # m: it runs from any seen enemy this close
arrive_m = 15                # m: a move that ends farther than this from its goal has failed ...
max_fails = 2                # ... and after this many it takes where it stands (no move loops, S7 tick fix)
repath_s = 8                 # s: no job sends the same move again within this
refusal_memory = 1           # switch (S10b-ai F8, L5): a truck's give-up is remembered and not ordered again

# S9: AT guns (docs/slices/S9-at-guns.md 12). Each card carries gun, crew and tow.
[ai.guns]
after_s = 120                # s: it buys a gun from this match time, or once an enemy vehicle has been seen (S9-13)
income_max_pct = 30          # %: all its gun cards cost at most this share of the income so far (S9b: 35 cost the half-tracks and tanks more than the guns repaid: 17 hard misses against 10 at 30, 480 matches); the share is set aside from the time it may buy (the first gun near 4:30-5:30)
reserve_mp = 0               # MP: left after a gun is bought
max_guns = 2                 # guns alive or called in at once
site_min_m = 150             # m: sites lie on rings around the point from this far (no nearer than corridor_clear_m: the corridor ends at the point) ...
site_max_m = 250             # m: ... up to this far (guns-artillery.md 9)
site_rings = 5               # rings of candidates between those two
site_bearings = 16           # candidates per ring, all around the point
site_forward_m = 0           # m: no site is more than this nearer to the enemy base than the point: sites ahead of it are overrun (S9b)
site_enemy_point_m = 250     # m: no site within this of a point the enemy holds: its men are there (S9b)
site_view_min_pct = 10       # %: sites that see less than this share of the best site's corridor samples are dropped; among the rest cover decides, a gun in the open dies (S9b)
corridor_m = 500             # m: the last stretch of the enemy armour's vehicle route to the point that is sampled (S9b) ...
corridor_step_m = 25         # m: ... every this far
corridor_clear_m = 150       # m: no site within this of the corridor: a gun on the route is overrun, it fires across it from the side (S9b)
corridor_paths = 2           # seen enemy armoured vehicles whose routes are searched, nearest the point first (S9b)
site_apart_m = 60            # m: two guns site at least this far apart
approach_m = 350             # m: with no route, the straight approach sampled ahead of the point ...
los_rays = 6                 # ... at this many points; also the fewest samples the routes of seen armour must give before the enemy base's route is added
enemy_standoff_m = 80        # m: no site within this of known enemy men
arrive_m = 15                # m: a move that ends farther than this from its goal has failed ...
arrive_cover_m = 5           # m: a site with cover (woods edge, crest) counts as reached only with the gun this close
max_fails = 2                # ... after this many the tow unhitches where it stands (no move loops, S7 tick fix)
repath_s = 8                 # s: no job sends the same order again within this
go_max_s = 150               # s: the tow unhitches at the latest this long after setting off
contact_m = 60               # m: no unhitching with an enemy this close (the site moves back)
engage_still_m = 400         # m: holds fire until a target is this close (done-when; the design's 250 was before the 437 m optic)
relay_gap_s = 25             # s: it re-lays the trail at most this often
pit_engineer_m = 350         # m: an idle engineer squad this close digs its pit (0: never)
recrew_m = 100               # m: idle infantry this close serves a neutral gun with rounds (0: never)
recrew_gap_s = 60            # s: one such order per gun within this
resite_idle_s = 120          # s: a gun with no vehicle target or armour in reach this long packs and tows to a held point with armour (0: never; S9 review)
resite_max = 3               # moves one gun makes in a match

# S10a-ai: fortification AI (docs/slices/S10a-ai.md 3.7). Starting values;
# the four switches (1 on, 0 off) are the ablations of spec 9.
[ai.fort]
works = 1                    # switch: MG nests, dugouts, the HQ roof, sandbags at guns
wire = 1                     # switch: barbed wire
