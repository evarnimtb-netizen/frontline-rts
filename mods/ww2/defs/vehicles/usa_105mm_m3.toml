# 105 mm Howitzer M3 (S11a1 C2; docs/design/roster/artillery-on-map.md 2.2,
# 4.5, 4.7): the US Cannon Company howitzer, a served gun (`role = "inf_gun"`)
# on the 57 mm M1 carriage layout (S9) with a 1.6 m shield. No tow in S11a1
# (S11a1-4 (A)): pushed. It cannot fire high-angle (max +30 deg). Figures
# with no source in the design documents are marked "verify".
id = "ww2:usa_105mm_m3"
name = "105 mm Howitzer M3"
short_name = "105 mm M3"
faction = "ww2:usa"
role = "inf_gun"
crew_model = "served"
# Mass in firing position, kg (artillery-on-map.md 2.2 "about 1,130 kg").
mass_kg = 1130
# Card price, MP (artillery-on-map.md 4.7: 380, no tow in S11a1).
cost = 380
# The gun's pop is 2 (artillery-on-map.md 4.7; the crew count as soldiers).
pop = 2
# Card cooldown 120 s, unlock 4:00 (artillery-on-map.md 4.7).
recall_cooldown_s = 120
initial_cooldown_s = 240
sight_m = 175
spot_size_pct = 85
eye_height_cm = 110
crew_squad = "ww2:usa_105mm_m3_crew"
rare_cap = 0
sources = ["artillery-on-map.md 2.2, 4.5, 4.7 (public tables, verify)", "57 mm M1 carriage layout (S9)"]

[mobility]
type = "towed"
# Full-crew push speed, cm/s (verify).
speed_cm_s = 40
reverse_cm_s = 40
turn_deg_s = 22
accel_cm_s2 = 50
brake_cm_s2 = 200
max_slope_pct = 15
ditch_block_dm = 6
bog_pct = 0
unbog_s = [0, 0]
moving_spread_pct = 100
push_men = 5
# Seconds to emplace, pack, hitch; lighter than the Pak 40 (verify).
emplace_s = 25
pack_s = 16
hitch_s = 18
relay_trail_s = 12
# Gun origin to the trail tip that goes on the hitch, cm (the rigid bar; matches the trail box).
tow_bar_cm = 290

[hull]
track_band_pct = 0
track_mm = 0

# Boxes as on the Pak 40: axle, shield (single 6.4 mm plate, verify), trail.
[[boxes]]
id = "axle"
frame = "hull"
box = { center = [0, 0, 45], half = [15, 90, 20] }
[boxes.armor]
front = { thickness_mm = 6 }
side = { thickness_mm = 6 }
rear = { thickness_mm = 6 }
top = { thickness_mm = 6 }

[[boxes]]
id = "shield"
frame = "hull"
box = { center = [40, 0, 80], half = [3, 80, 50] }
[boxes.armor]
front = { thickness_mm = 6.4, slope_deg = 15 }
side = { thickness_mm = 3 }
rear = { thickness_mm = 3 }
top = { thickness_mm = 3 }

[[boxes]]
id = "trail"
frame = "hull"
box = { center = [-160, 0, 25], half = [130, 20, 25] }
[boxes.armor]
front = { thickness_mm = 6 }
side = { thickness_mm = 6 }
rear = { thickness_mm = 6 }
top = { thickness_mm = 6 }

[[service]]
role = "gunner"
at = [-60, 50, 0]
pose = "kneel"
[[service]]
role = "loader"
at = [-60, -50, 0]
pose = "kneel"
[[service]]
role = "commander"
at = [-290, 70, 0]
pose = "kneel"
[[service]]
role = "ammo"
at = [-420, 85, 0]
pose = "kneel"
[[service]]
role = "ammo"
at = [-420, 0, 0]
pose = "kneel"
[[service]]
role = "ammo"
at = [-420, -85, 0]
pose = "kneel"

# M18 telescope (S9-1 (A): 437 m inside the arc).
[optic]
sight_pct = 250

[[weapons]]
def = "ww2:m3_105mm"
mount = "casemate"
# Gun pivot in the gun frame, cm (verify).
pivot = [0, 0, 80]
# Muzzle from the pivot, cm (a short barrel, about 1.9 m; verify).
muzzle = [190, 0, 10]
# Traverse arc, deg (spec C2: -22..+22; verify).
traverse_deg = [-22, 22]
# Hand traverse and elevation, deg/s (as the 57 mm M1; verify).
traverse_deg_s = 9
elevate_deg_s = 6
# Elevation, deg (artillery-on-map.md 2.2 "-9 to +30").
elevation_deg = [-9, 30]
# 10 M1 HE (spec C2; verify).
ammo = [{ id = "ww2:105mm_m1_he", count = 10 }]
barrel = { length_cm = 190, radius_cm = 6 }

[[components]]
type = "gun"
hp = 80
box = { frame = "hull", center = [-30, 0, 80], half = [28, 12, 12] }

[[components]]
type = "ammo_rack"
hp = 40
box = { frame = "hull", center = [-120, -55, 20], half = [25, 25, 15] }

[[components]]
type = "wheels_front"
hp = 60
anchors = [{ pos = [0, 80, 40] }, { pos = [0, -80, 40] }]
repair = { to_hp = 60, time_s = 30 }

[[components]]
type = "sight"
hp = 30
anchors = [{ pos = [-15, 28, 105] }]
repair = { to_hp = 30, time_s = 30 }

[[components]]
type = "recoil"
hp = 50
box = { frame = "hull", center = [10, 0, 70], half = [22, 8, 8] }
repair = { to_hp = 50, time_s = 40 }
