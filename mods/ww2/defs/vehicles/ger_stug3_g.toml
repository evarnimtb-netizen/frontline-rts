# Sturmgeschütz III Ausf. G (S7, docs/slices/S7-casemate-td.md 5): an
# assault gun, a casemate on a Panzer III chassis with the 7.5 cm StuK 40
# L/48. Low, thick in front, slow to switch targets, weak when flanked.
# Sources: Jentz & Doyle, Panzer Tracts 8-2 (Sturmgeschütz; specification
# table, stowage, layout); Wikipedia "Sturmgeschütz III" (spec table).
# Figures not read in a source are marked "verify" (owner question S7-6,
# S7-10). Frames as in ger_pz4_h.toml: cm, hull frame x forward, y left,
# z up from the ground under the hull's centre. No turret: the gun turns
# in its casemate mount about `pivot` (hull frame).
id = "ww2:ger_stug3_g"
name = "Sturmgeschütz III Ausf. G"
short_name = "StuG III"
faction = "ww2:germany"
role = "assault_gun"
# S7-3 (A): 500 MP = the Panzer IV's 620 x 82,500 / 103,462 RM (unit
# prices, Wikipedia "Sturmgeschütz III" and "Panzer IV"); Tune within
# +-15 %. A gameplay balance value, not a price.
cost = 500
# Population: one vehicle of four crew (the Panzer IV's 12 for five; S7-3).
pop = 10
# Call-in cooldown (s): the owner's tank cooldown (S3b, 2026-11-01).
recall_cooldown_s = 120
initial_cooldown_s = 0
sight_m = 175
# S7 low silhouette (vehicles.md 6.3): seen at 160 % of an observer's
# sight (the tanks 200 %): 2.16 m high against the Sherman's 2.74 m. A
# starting value; measured in armour-test case 17-18 and the batches.
spot_size_pct = 160
# The commander's periscope over the casemate roof (2.08 m + 0.2), cm.
eye_height_cm = 230
sources = [
  "Jentz & Doyle, Panzer Tracts 8-2: Sturmgeschütz (specification, stowage, layout)",
  "Wikipedia, Sturmgeschütz III (specification table, unit price)",
]
crew_squad = "ww2:ger_tank_crew"
# S5a (D3): at most 3 PzGr 40 (the Panzer IV's cap; tungsten rationed).
rare_cap = 3

[mobility]
type = "tracked"
# 40 km/h road (Wikipedia) on the game's road-speed scale (Panzer IV 38
# km/h -> 600 cm/s): 620 cm/s.
speed_cm_s = 620
reverse_cm_s = 200
turn_deg_s = 30
accel_cm_s2 = 150
brake_cm_s2 = 400
max_slope_pct = 50
ditch_block_dm = 19
bog_pct = 6
unbog_s = [20, 40]
# No stabiliser: x4 on the move, as the Panzer IV.
moving_spread_pct = 400

[hull]
# The lower 45 % of each hull side is running gear (+20 mm), as the
# Panzer IV (verify).
track_band_pct = 45
track_mm = 20

# Armour boxes (S7 schema): box 0 the hull (5.40 x 2.90 m, 0.38-1.42 m up),
# then the casemate on it (about 3.0 x 2.2 m, 1.42-2.08 m up; hull frame).
# Zone ids: hull_front 0 ... hull_top 3, casemate_front 4 ... casemate_top 7.
[[boxes]]
id = "hull"
frame = "hull"
box = { center = [0, 0, 90], half = [270, 145, 52] }
[boxes.armor]
# 50 + 30 mm bolted plate on the nose at 21° (Panzer Tracts 8-2).
front = { thickness_mm = 80, slope_deg = 21 }
side = { thickness_mm = 30, slope_deg = 0 }
# 50 mm at 10° (verify).
rear = { thickness_mm = 50, slope_deg = 10 }
top = { thickness_mm = 16 }

[[boxes]]
id = "casemate"
frame = "hull"
box = { center = [40, 0, 175], half = [150, 110, 33] }
[boxes.armor]
# 50 + 30 mm superstructure front at 10° (Panzer Tracts 8-2).
front = { thickness_mm = 80, slope_deg = 10 }
side = { thickness_mm = 30, slope_deg = 11 }
# 30 mm at 30° (verify).
rear = { thickness_mm = 30, slope_deg = 30 }
top = { thickness_mm = 10 }

# Crew of four (Panzer Tracts 8-2 layout; positions approximate within the
# box model): the driver front left in the hull, the gunner left of the
# gun, the commander behind him, the loader (also the radio operator)
# right of the gun. The casemate crew sit low with their heads in it.
[[seats]]
id = "driver"
role = "driver"
box = { frame = "hull", center = [180, 60, 110], half = [35, 30, 40] }
in = "hull"

[[seats]]
id = "gunner"
role = "gunner"
box = { frame = "hull", center = [80, 50, 135], half = [30, 25, 60] }
in = "casemate"

[[seats]]
id = "commander"
role = "commander"
box = { frame = "hull", center = [10, 50, 145], half = [30, 30, 60] }
in = "casemate"

[[seats]]
id = "loader"
role = "loader"
box = { frame = "hull", center = [50, -55, 130], half = [30, 30, 70] }
in = "casemate"

[[weapons]]
def = "ww2:stuk40_l48"
mount = "casemate"
# Hull frame: the mount sat right of centre in the casemate front.
pivot = [110, -15, 165]
# From the pivot: 3.0 m to the muzzle, a 1.4 m overhang (6.77 m with the
# gun, 5.38 m hull; Wikipedia).
muzzle = [300, 0, 0]
# S7 casemate arc (deg from the hull's front, positive left): 10° each way
# (Panzer Tracts 8-2).
traverse_deg = [-10, 10]
# Hand traverse and elevation (deg/s): no source read, starting values
# (owner question S7-10).
traverse_deg_s = 6
elevate_deg_s = 4
elevation_deg = [-6, 20]
# Stowage 54 rounds (Panzer Tracts 8-2): split 27 PzGr 39, 24 Sprgr 34,
# 3 PzGr 40 (the split is a starting value, verify; rare_cap 3).
ammo = [
  { id = "ww2:75mm_pzgr39", count = 27 },
  { id = "ww2:75mm_sprgr34", count = 24 },
  { id = "ww2:75mm_pzgr40", count = 3 },
]
# The exposed barrel from the muzzle back to the casemate front (300 - 80
# cm); 8 cm half-width as the Panzer IV's.
barrel = { length_cm = 220, radius_cm = 8 }

[[components]]
type = "engine"
hp = 100
box = { frame = "hull", center = [-200, 0, 90], half = [65, 100, 45] }
repair = { to_hp = 50, time_s = 60 }

[[components]]
type = "track_left"
hp = 100
anchors = [{ pos = [230, 125, 40] }, { pos = [0, 125, 40] }, { pos = [-230, 125, 40] }]
repair = { to_hp = 100, time_s = 30 }

[[components]]
type = "track_right"
hp = 100
anchors = [{ pos = [230, -125, 40] }, { pos = [0, -125, 40] }, { pos = [-230, -125, 40] }]
repair = { to_hp = 100, time_s = 30 }

# The breech behind the mount (hull frame: the gun turns only 10°).
[[components]]
type = "gun"
hp = 80
box = { frame = "hull", center = [70, -15, 160], half = [40, 20, 18] }

# Stowage bins along both sides of the fighting compartment (Panzer Tracts
# 8-2; positions approximate). No turret ring.
[[components]]
type = "ammo_rack"
hp = 60
boxes = [
  { frame = "hull", center = [20, 95, 120], half = [55, 25, 35] },
  { frame = "hull", center = [20, -95, 120], half = [55, 25, 35] },
]

[[components]]
type = "transmission"
hp = 100
box = { frame = "hull", center = [210, 0, 80], half = [55, 30, 40] }
repair = { to_hp = 50, time_s = 60 }

[[stations]]
id = "driver_gunner"
seats = ["driver", "gunner"]

[[stations]]
id = "commander"
seats = ["commander"]

# Hatches in the casemate roof (Panzer Tracts 8-2): the commander's and
# gunner's hatch (the driver has none of his own and leaves by it after
# them) and the loader's. Exit times are starting values.
[[hatches]]
seats = ["commander", "gunner", "driver"]
frame = "hull"
pos = [10, 50, 208]
exit_ms = 3500

[[hatches]]
seats = ["loader"]
frame = "hull"
pos = [50, -55, 208]
exit_ms = 3000
