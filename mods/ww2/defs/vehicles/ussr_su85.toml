[[components]]
type = "track_right"
hp = 100
anchors = [{ pos = [260, -135, 45] }, { pos = [0, -135, 45] }, { pos = [-260, -135, 45] }]
repair = { to_hp = 100, time_s = 30 }

[[components]]
type = "gun"
hp = 80
box = { frame = "hull", center = [110, 0, 175], half = [40, 20, 18] }

[[components]]
type = "ammo_rack"
hp = 60
boxes = [
  { frame = "hull", center = [60, 110, 120], half = [55, 25, 35] },
  { frame = "hull", center = [60, -110, 120], half = [55, 25, 35] },
]

[[components]]
type = "transmission"
hp = 100
box = { frame = "hull", center = [-260, 0, 80], half = [30, 60, 35] }
repair = { to_hp = 50, time_s = 60 }

[[stations]]
id = "driver_gunner"
seats = ["driver", "gunner"]

[[stations]]
id = "commander"
seats = ["commander"]

[[hatches]]
