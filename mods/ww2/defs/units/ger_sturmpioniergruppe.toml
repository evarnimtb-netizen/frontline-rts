# S10a: Sturmpioniergruppe (assault engineers, roster-expansion.md 3.1):
# eight men, the leader with an MP 40, three StG 44 and four MP 40; two
# Bangalore torpedoes (gestreckte Ladung), two satchel charges and stick
# grenades. Assault tier: cut wire fast, breach, no building
# (docs/slices/S10a-fortifications.md 3.4). S10a-ai: ai_weight 60
# (stage D, owner 2026-11-11; was 35) in the engineer slot (S10a-12 (A); [ai.fort] cards = 0 skips it); the
# leader and two StG 44 men carry one Nebelhandgranate 39 each (the
# Pioniergruppe's smoke grenade, S10a-13 (A); three men: owner 2026-11-11, so
# losing the leader does not end the breach) to screen a Bangalore carrier.
id = "ww2:ger_sturmpioniergruppe"
name = "Sturmpioniergruppe"
short_name = "Sturmpioniere"
faction = "ww2:germany"
tags = ["engineer", "assault"]
ai_weight = 60
capabilities = ["dig_basic", "clear_wire", "breach", "recrew", "clear_mines", "demolish"]
# Roster 3.1: 320 MP x 0.8 (S5a-37 German cut) x 1.033 (S6 tune) = 264 (S10a-8 (A)).
cost = 264
cooldown_s = 60
unlock_s = 0
speed_cm_s = 300
sight_m = 150
spacing_dm = 30
dig_rate_pct = 100

[[members]]
slot = "leader"
weapon = "ww2:mp40"
traits = ["leader"]
items = { "ww2:stielhandgranate" = 2, "ww2:gestreckte_ladung" = 1, "ww2:nbhgr39" = 1 }

[[members]]
slot = "sturmpionier_stg_nebel"
count = 2
weapon = "ww2:stg44"
items = { "ww2:stielhandgranate" = 2, "ww2:nbhgr39" = 1 }

# S14 (plan 4.2): the fourth man is a `when` pair under one slot name. With
# `[flame] enabled` 0 (`flame_off`) he is today's StG 44 man; with 1
# (`flame_on`) the same man is also the flamethrower's assistant, who takes
# it up when the operator falls (S4 crew pickup). Historical: pioneers alone
# carried flamethrowers, attached for an assault (US Intelligence Bulletin,
# April 1944: 2 per 60-man pioneer platoon).
[[members]]
slot = "flammenwerfer_helfer"
when = "flame_off"
weapon = "ww2:stg44"
items = { "ww2:stielhandgranate" = 2 }

[[members]]
slot = "flammenwerfer_helfer"
when = "flame_on"
weapon = "ww2:stg44"
traits = ["crew_assistant"]
items = { "ww2:stielhandgranate" = 2 }

[[members]]
slot = "sprengtrupp"
weapon = "ww2:mp40"
items = { "ww2:stielhandgranate" = 2, "ww2:gestreckte_ladung" = 1 }

[[members]]
slot = "ladungstraeger"
count = 2
weapon = "ww2:mp40"
items = { "ww2:stielhandgranate" = 2, "ww2:geballte_ladung" = 1 }

# S14 (plan 4.2): the last man is a `when` pair. `flame_off`: today's MP 40
# man; `flame_on`: the Flammenwerfer 41 operator (a P 38 when the tank is
# dry, F1) with the same two stick grenades.
[[members]]
slot = "flammenwerfer"
when = "flame_off"
weapon = "ww2:mp40"
items = { "ww2:stielhandgranate" = 2 }

[[members]]
slot = "flammenwerfer"
when = "flame_on"
weapon = "ww2:fmw41"
sidearm = "ww2:p38"
traits = ["crew_gunner"]
items = { "ww2:stielhandgranate" = 2 }
