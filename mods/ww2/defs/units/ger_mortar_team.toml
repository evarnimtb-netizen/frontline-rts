# Granatwerfergruppe (S5b): one 8 cm GrW 34 served by a five-man squad: the
# leader observes and adjusts (binoculars), the gunner lays and fires, the
# assistant and two ammunition bearers carry the bombs (S5a counts them and
# feed the tube through take_bomb and the sharing pass). The tube is a crew
# weapon: when its gunner falls the nearest man takes it up. The historical
# 1944 Gruppe was larger (1 + 5 or more, verify; K.St.N. not found online);
# 5 is the roster's pop-capped size (roster-expansion.md §3.1, Q6 (A)).
# The card id stays (S5b-7 (A)): the AI mix, saves and tests keep working.
id = "ww2:ger_mortar_team"
name = "Granatwerfergruppe"
short_name = "Granatwerfer"
faction = "ww2:germany"
tags = ["mortar"]
capabilities = ["recrew"]
sources = [
    "roster-expansion.md §3.1 (5 men, about 20 bombs, 300 MP)",
    "US War Department, German Infantry Weapons (MID 1943), 8-cm heavy mortar model 34 ('Twenty-four rounds are usually carried by a mortar crew in action'; bombs in cases)",
    "US War Department, Intelligence Bulletin, Feb 1944, 'Concentrating mortar fire' (one section is controlled by voice)",
]
# S5b: 300 (the roster's 5-man card) with the S5a-37 German cut (-20 %):
# 240 (S5b-10 (A); was 225 for the 3-man Granatwerfertrupp). S5a Tune
# history: 280 -> 225 (-20 %) brought Germany from 31 % to 50 % of 160
# matches (docs/slices/S5a-ammo.md "Tune results").
cost = 245   # S6b tune: x0.99 on the S6 value 247 (autotune ger_price_mult 0.992 [0.970-1.021], Germany 50 %); S6 had x1.03 on the S5a-37 value
# Call-in (S3b): 60 s set by the owner on 2026-11-01 (20 % under the first
# proposal of 75 s).
cooldown_s = 60
unlock_s = 0
speed_cm_s = 240
sight_m = 150
spacing_dm = 25
dig_rate_pct = 0

# Gruppenführer: observes fire missions at rules fire_mission.observe_leader_m
# (every squad leader does).
[[members]]
slot = "leader"
weapon = "ww2:mp40"
traits = ["leader"]

[[members]]
slot = "mortar_gunner"
weapon = "ww2:grw34"
sidearm = "ww2:p38"
# Two ready bombs at the tube (rounds of the bomb feed; the weapon's load
# is 3). 20 bombs a squad: 2 + 4 + 7 + 7 (S5b-5 (A) "about 20", under the 24
# a German crew usually carried in action; per-man loads are not sourced:
# a case of 3-4 bombs is 11-14 kg, two cases a bearer).
rounds = { "ww2:8cm_wgr34" = 2 }
traits = ["crew_gunner"]

[[members]]
slot = "mortar_assistant"
weapon = "ww2:kar98k"
rounds = { "ww2:8cm_wgr34" = 4 }
traits = ["crew_assistant"]

[[members]]
slot = "ammo_bearer"
count = 2
weapon = "ww2:kar98k"
rounds = { "ww2:8cm_wgr34" = 7 }
traits = ["ammo_bearer"]
