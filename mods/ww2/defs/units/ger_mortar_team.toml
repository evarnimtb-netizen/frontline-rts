# Granatwerfertrupp (S4): one 8 cm GrW 34 and two men with Kar98k (the S1-S3
# team carried a tube each, S4-2 (A)). The tube is a crew weapon: when its
# gunner falls the nearest man takes it up.
id = "ww2:ger_mortar_team"
name = "Granatwerfertrupp"
short_name = "Granatwerfer"
faction = "ww2:germany"
tags = ["mortar"]
capabilities = ["recrew"]
# S5a Tune: 280 -> 225 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
cost = 225
# Call-in (S3b): 60 s set by the owner on 2026-11-01 (20 % under the first
# proposal of 75 s).
cooldown_s = 60
unlock_s = 0
speed_cm_s = 240
sight_m = 150
spacing_dm = 25
dig_rate_pct = 0

[[members]]
slot = "mortar_gunner"
weapon = "ww2:grw34"
sidearm = "ww2:p38"
traits = ["leader", "crew_gunner"]

[[members]]
slot = "mortar_crew"
count = 2
weapon = "ww2:kar98k"
# S5a: six bombs each (two cases of three); 15 for the team with the
# gunner's 3 (owner question S5a-16 (A); S5b moves to 5 men with bearers).
rounds = { "ww2:8cm_wgr34" = 6 }
traits = ["crew_assistant"]
