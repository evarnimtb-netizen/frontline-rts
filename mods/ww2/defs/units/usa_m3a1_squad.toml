# The M3A1 half-track as a buyable squad of one (S8a): call-in, cards and
# the AI use the squad path. Cost, pop, call-in time and sight are in the
# vehicle def. Transports skip the rules' vehicle limit (S8a-5); this card
# caps them at max_alive.
id = "ww2:usa_m3a1_squad"
name = "M3A1 half-track"
short_name = "M3A1"
faction = "ww2:usa"
tags = ["vehicle"]
vehicle = "ww2:usa_m3a1"
# Most alive per player (S8a-5 (A); spec 6): 2.
max_alive = 2
# AI weight within the `vehicle` slot (0..1000; 0 = the AI never buys it).
# 150 (S8a Build B, S8a-21 (A)): the vehicle slot's buys go to the card
# furthest below its weight share, so the half-track (unlocked at 2:00,
# outside the vehicle limit) comes before the first tank; at 100 (the
# tanks') it came third, after 12 minutes. max_alive caps it at 2.
ai_weight = 150
