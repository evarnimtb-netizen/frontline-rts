# Pioniergruppe (S4): eight engineers (roadmap; the US T/O&E combat engineer
# squad is 12, S4-4 (A)): the leader with an MP 40, a satchel charge and a
# smoke grenade, one more MP 40 and six Kar98k. Digs at twice the rate and
# the AT ditch (`dig_full`).
id = "ww2:ger_engineer_squad"
name = "Pioniergruppe"
short_name = "Pioniere"
faction = "ww2:germany"
tags = ["engineer"]
# S10a-ai stage D (owner 2026-11-11, "Germany by weight"): the Baupioniere are
# Germany's default builder; the Pioniere come third in the engineer slot
# (weights 100 Bau, 60 Sturm, 40 here: Bau, Sturm, Bau, Pioniere, ...).
ai_weight = 40
# S10a: field engineers (infantry-structures.md 7.7): sandbags, MG nests,
# dugouts and wire at the field rate, wire cut at the field rate.
capabilities = ["dig_basic", "dig_full", "recrew", "build_structure", "place_wire", "clear_wire", "place_mines", "clear_mines", "demolish"]
# Manpower per call-in (S4 starting value for eight men: 280).
# S4 Tune: 280 -> 250. Germany's non-line cards cost about 10 % less (its income buys fewer men). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S5a Tune: 250 -> 200 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
cost = 206   # S6 tune: x1.03 on 200 (autotune ger_price_mult 1.033 [0.970-1.089], Germany 50 %); the S5a-37 cut is now -17.6 %
# Re-call cooldown (s): its own timer (Q21 (B)).
cooldown_s = 30
unlock_s = 0
speed_cm_s = 290
sight_m = 150
spacing_dm = 30
dig_rate_pct = 200

[[members]]
slot = "leader"
weapon = "ww2:mp40"
traits = ["leader"]
items = { "ww2:stielhandgranate" = 2, "ww2:nbhgr39" = 1, "ww2:geballte_ladung" = 1 }

[[members]]
slot = "pionier_smg"
weapon = "ww2:mp40"
items = { "ww2:stielhandgranate" = 1 }

[[members]]
slot = "pionier"
count = 6
weapon = "ww2:kar98k"
items = { "ww2:stielhandgranate" = 1 }
