# Grenadiergruppe (Feldstärke) (S4): the same squad at a field strength of
# seven, as most German squads stood by mid-1944 (roadmap §3.1; owner Q6
# (A): cheaper understrength cards). The leader, the MG team of three and
# three Schützen, one with a Panzerfaust 60 (S4-5 (A)). Made only of
# `extends` and a member list, plus its card keys.
id = "ww2:ger_grenadiergruppe_7"
extends = "ww2:ger_grenadiergruppe"
name = "Grenadiergruppe (Feldstärke)"
# S4 review: the men disc shows the count; "(F)" = Feldstärke, so the
# tile reads apart from the full Grenadiere at HUD width 1280.
short_name = "Gren. (F)"
tags = ["line", "understrength"]
# 190 for the squad, +10 for the Panzerfaust.
# S4 Tune: 230 -> 200. Same price per man as the full squad (28.6 MP). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S5a Tune: 200 -> 160 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
cost = 160
# The AI buys it about half as often as the full squad (S4-8 (A)).
ai_weight = 50

[[members]]
slot = "leader"
weapon = "ww2:mp40"
traits = ["leader"]
items = { "ww2:stielhandgranate" = 2, "ww2:nbhgr39" = 1 }

