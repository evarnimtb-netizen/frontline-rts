# 190 for the squad, +10 for the Panzerfaust.
# S4 Tune: 230 -> 200. Same price per man as the full squad (28.6 MP). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
