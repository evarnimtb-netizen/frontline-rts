# Grenadiergruppe (Feldstärke) (S4): the same squad at a field strength of
# seven, as most German squads stood by mid-1944 (roadmap §3.1; owner Q6
# (A): cheaper understrength cards). The leader, the MG team of three and
# three Schützen, one with a Panzerfaust 60 (S4-5 (A)). Made only of
# `extends` and a member list, plus its card keys.
id = "ww2:ger_grenadiergruppe_7"
extends = "ww2:ger_grenadiergruppe"
name = "Grenadiergruppe (Feldstärke)"
