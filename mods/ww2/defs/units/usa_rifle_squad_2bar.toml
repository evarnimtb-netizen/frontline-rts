# Rifle Squad, two BARs (S4): US divisions increasingly gave squads a
# second BAR team in 1944-45, following Marine practice. As the Rifle
# Squad, with a second automatic rifleman and assistant in place of two
# riflemen.
# Sources: Wikipedia "M1918 Browning Automatic Rifle" (the practice; no
# date). available_from is a field-practice date, unverified (S4-17 (A));
# skirmish has no date filter.
id = "ww2:usa_rifle_squad_2bar"
extends = "ww2:usa_rifle_squad"
name = "Rifle Squad (two BARs)"
short_name = "Rifle Sq 2BAR"
sources = ["Wikipedia, M1918 Browning Automatic Rifle (two BAR teams per squad, 1944-45)"]
# S4 Tune: 360 -> 380. Keeps the +20 over the full squad for the second BAR. Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
cost = 380
cooldown_s = 30
available_from = "1944-08"
ai_weight = 50

