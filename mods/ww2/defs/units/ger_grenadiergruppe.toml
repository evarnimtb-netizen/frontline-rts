# Grenadiergruppe (S4): the German rifle squad at establishment strength,
# replacing the S1-S3 Schützengruppe (owner Q6 (A): historical squad sizes).
# A Gruppenführer with an MP 40, the MG team of three (the gunner with the
# MG 42 on its bipod and a P 38, his assistant with a P 38, the third man an
# ammo bearer with a Kar98k), and six Schützen with Kar98k, two of whom carry
# a Panzerfaust 60 (S3c-29 (A), S4-5 (A)).
# Sources: Wikipedia "MG 42" (squad organisation around the MG); the Gruppe
# drill as summarised from German manuals (MG team of three: gunner with the
# MG and a pistol, assistant with a pistol, spare barrel and drums, third man
# with a rifle and ammunition; miniatures.de "German Infantry Section 1937"
# gives the same pistols for gunner and assistant). S4 review: the
# Volksgrenadier table (battleorder.org "Volksgrenadiers 1944", K.St.N. 131V,
# 1 Nov 1944) arms MG-Schütze 2 with a Kar98k instead; that is the late-war
# VG squad (S5), not this Grenadiergruppe, so the assistant keeps the P 38.
# Some 1944 secondary sources give 9 men; 10 kept (roster, Q6 (A)); the
# K.St.N. 131 primary table and TM-E 30-451 (1945) squad section were not
# read (citation task, S4 log).
id = "ww2:ger_grenadiergruppe"
name = "Grenadiergruppe"
short_name = "Grenadiere"
faction = "ww2:germany"
tags = ["line"]
capabilities = ["dig_basic", "recrew"]
sources = [
    "Wikipedia, MG 42 (squad organisation)",
    "battleorder.org, Volksgrenadiers 1944 (K.St.N. 131V, 1 Nov 1944; VG variant, S5)",
    "miniatures.de, German Infantry Section 1937 (MG team pistols)",
]
# Manpower per call-in: 260 for the squad, +10 for each Panzerfaust (S4-5 (A)).
# S4 Tune: 320 -> 280. Ten men with bolt-action Kar98k (15 rounds/min) and one MG 42 field about half
# the rifle fire of the twelve semi-automatic Garands of the US squad (24/min), so
# the same manpower buys more German squads (28 MP a man at 280, now 22.5; the US squad 30). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S5a Tune: 280 -> 225 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
cost = 230   # S6b tune: x0.99 on the S6 value 232 (autotune ger_price_mult 0.992 [0.970-1.021], Germany 50 %); S6 had x1.03 on the S5a-37 value
# Call-in (S3b, S4 card block): a call-in spawns the squad at once at the
# base; then this card cannot be called in again for cooldown_s seconds
# (its own timer: owner Q21 (B), no cooldown_group). 20 s for a 10-man
# squad (S4 starting value).
cooldown_s = 20
# Seconds from the match start before the first call-in; 0 = at once.
unlock_s = 0
# Walking speed (cm/s), sight (m), formation spacing (dm).
speed_cm_s = 300
sight_m = 150
spacing_dm = 30
# Digging speed per man (% of the base rate).
dig_rate_pct = 100

# The men, in spawn and formation order; the first man leads.
[[members]]
slot = "leader"
weapon = "ww2:mp40"
traits = ["leader"]
items = { "ww2:stielhandgranate" = 2, "ww2:nbhgr39" = 1 }

[[members]]
slot = "mg_gunner"
weapon = "ww2:mg42_bipod"
sidearm = "ww2:p38"
traits = ["crew_gunner"]

[[members]]
slot = "mg_assistant"
weapon = "ww2:p38"
# S5a: four 50-round drums and one 300-round box for the MG (secondary
# sources: assistant 4 drums and 1 box; with the gunner's drum and the
# bearer's two boxes about 1,150 rounds, verify; totals vary 1,150-1,800).
rounds = { "ww2:792x57_belt" = 500 }
traits = ["crew_assistant"]

[[members]]
slot = "ammo_bearer"
weapon = "ww2:kar98k"
# S5a: two 300-round boxes for the MG (skirmishmagazine.com; secondary).
rounds = { "ww2:792x57_belt" = 600 }
traits = ["ammo_bearer"]

[[members]]
slot = "rifleman_pzf"
count = 2
weapon = "ww2:kar98k"
items = { "ww2:stielhandgranate" = 1, "ww2:panzerfaust60" = 1 }

[[members]]
