# sMG-Gruppe (S4): a heavy MG squad with one MG 42 on the Lafette 42 tripod,
# replacing the S1-S3 MG-Trupp (which fielded three MG 42s, S4-2 (A)). The
# Gruppenführer, the gunner (MG 42 and a P 38), his assistant (P 38) and
# three ammo bearers with Kar98k: six men, the optimum sustained-fire crew
# (S4-3 (A); heavy MG squads were 7 in 1944).
# Sources: Wikipedia "MG 42" (sustained-fire crew of 6, 7 in 1944).
id = "ww2:ger_smg_gruppe"
name = "sMG-Gruppe"
short_name = "sMG-Gruppe"
faction = "ww2:germany"
tags = ["mg"]
capabilities = ["recrew"]
sources = ["Wikipedia, MG 42 (sustained-fire crew)"]
# Manpower per call-in (S4 starting value 220).
# S4 Tune: 220 -> 195, part of the German price cut that brought the
# faction balance into 35-65 % (S4 review: it does NOT keep the old price
# ratio to the US Light MG Section: 195/280 = 0.70, was 220/200 = 1.10; the
# US LMG price is a balance price, see that file). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S5a Tune: 195 -> 155 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
cost = 160   # S6 tune: x1.03 on 155 (autotune ger_price_mult 1.033 [0.970-1.089], Germany 50 %); the S5a-37 cut is now -17.6 %
# Re-call cooldown (s): its own timer (Q21 (B)).
cooldown_s = 30
unlock_s = 0
speed_cm_s = 260
sight_m = 150
spacing_dm = 25
# The MG squads do not dig (as the S1-S3 MG team).
dig_rate_pct = 0

[[members]]
slot = "leader"
weapon = "ww2:kar98k"
traits = ["leader"]

[[members]]
slot = "mg_gunner"
weapon = "ww2:mg42"
sidearm = "ww2:p38"
traits = ["crew_gunner"]

[[members]]
slot = "mg_assistant"
weapon = "ww2:p38"
# S5a: two 300-round boxes for the heavy MG (starting value: heavy MG
# section loads not found at the source, verify).
rounds = { "ww2:792x57_belt" = 600 }
traits = ["crew_assistant"]

[[members]]
slot = "ammo_bearer"
count = 3
weapon = "ww2:kar98k"
# S5a: two 300-round boxes each (starting value, verify): with the gun's
# belt about 2,550 rounds for the section.
rounds = { "ww2:792x57_belt" = 600 }
traits = ["ammo_bearer"]
