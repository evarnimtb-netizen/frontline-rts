# S10a: US Assault Section (roster-expansion.md 3.2): twelve men, the
# leader and five riflemen with the M1, a BAR team (gunner and assistant),
# a bazooka team (M9 and loader) and two demolition men with M1A1 Bangalore
# torpedoes. Assault tier: breach and cut wire (roster 3.2 gives no wire
# cutters' rate of their own: the tier's). S10a-ai: ai_weight 35 in the
# engineer slot (S10a-12 (A); [ai.fort] cards = 0 skips it). The leader and
# two riflemen carry one M15 smoke each (owner 2026-11-11: losing the leader
# does not end the breach).
id = "ww2:usa_assault_section"
name = "Assault Section"
short_name = "Assault Sec."
faction = "ww2:usa"
tags = ["engineer", "assault"]
ai_weight = 35
capabilities = ["dig_basic", "clear_wire", "breach", "recrew", "clear_mines"]
# Roster 3.2: 380 MP (no German cut) (S10a-8 (A)).
cost = 380
cooldown_s = 60
unlock_s = 0
speed_cm_s = 300
sight_m = 150
spacing_dm = 30
dig_rate_pct = 100

[[members]]
slot = "section_leader"
weapon = "ww2:m1_garand"
traits = ["leader"]
items = { "ww2:mk2_grenade" = 2, "ww2:m15_smoke" = 1 }

[[members]]
slot = "rifleman_smoke"
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1, "ww2:m15_smoke" = 1 }

# S14 (plan 4.2): the second smoke rifleman is a `when` pair. `flame_off`
# (`[flame] enabled` 0): today's man; `flame_on`: the same man, also the
# flamethrower's assistant (he takes it up when the operator falls). Men,
# order and kit with `flame_off` are exactly the S13 card's.
[[members]]
slot = "rifleman_smoke_flame"
when = "flame_off"
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1, "ww2:m15_smoke" = 1 }

[[members]]
slot = "rifleman_smoke_flame"
when = "flame_on"
weapon = "ww2:m1_garand"
traits = ["crew_assistant"]
items = { "ww2:mk2_grenade" = 1, "ww2:m15_smoke" = 1 }

[[members]]
slot = "rifleman"
count = 2
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1 }

# S14 (plan 4.2): the third rifleman is a `when` pair. `flame_off`: today's
# man; `flame_on`: the M1A1 flamethrower operator (an M1911A1 when the tank
# is dry, F1) with the same grenade. The June 1944 assault teams carried the
# M1A1 (about 150 landed on D-Day; Wikipedia, M1 flamethrower); the roster's
# M2-2 is a def with no card (S14-research-history.md 2).
[[members]]
slot = "rifleman_flame"
when = "flame_off"
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1 }

[[members]]
slot = "rifleman_flame"
when = "flame_on"
weapon = "ww2:m1a1_flamethrower"
sidearm = "ww2:m1911a1"
traits = ["crew_gunner"]
items = { "ww2:mk2_grenade" = 1 }

[[members]]
slot = "automatic_rifleman"
weapon = "ww2:bar_m1918a2"
items = { "ww2:mk2_grenade" = 1 }

[[members]]
slot = "asst_ar"
weapon = "ww2:m1_garand"
rounds = { "ww2:3006_bar" = 240 }
traits = ["crew_assistant"]
items = { "ww2:mk2_grenade" = 1 }

[[members]]
slot = "bazooka_gunner"
weapon = "ww2:m9_bazooka"
traits = ["crew_gunner"]

[[members]]
slot = "bazooka_loader"
weapon = "ww2:m1_garand"
traits = ["crew_assistant"]
items = { "ww2:mk2_grenade" = 1 }

[[members]]
slot = "demolition"
count = 2
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1, "ww2:m1a1_bangalore" = 1 }
