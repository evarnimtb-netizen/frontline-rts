# Panzerschrecktrupp (S3): a launcher gunner and a loader with a rifle.
# Available from the start; the AI buys it after vehicles unlock and an
# enemy vehicle has been seen. S4: as [[members]] and card keys, unchanged.
id = "ww2:ger_panzerschreck_team"
name = "Panzerschrecktrupp"
short_name = "Panzerschreck"
faction = "ww2:germany"
tags = ["at"]
# S4 Tune: 200 -> 180. Same price as the US Bazooka team; also more AT teams (T12). Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S5a Tune: 180 -> 145 (-20 %). With counted ammunition, fire discipline and the
# refill trips, Germany won 31 % of 160 matches (S5a log, B7); with those four
# switched off it wins 44 %, so the S4 balance moved ~13 points against it.
# Single-change runs on 160 matches: German prices -5 % 51 wins, -10 % 57, -15 %
# 74 (46 %), -20 % 80 (50 %); out of sample (seeds 101-180) -15 % 70, -20 % 87.
# The Garand's 24 rounds/min against the Kar98k's 15 stays the root cause.
# docs/slices/S5a-ammo.md "Tune results".
