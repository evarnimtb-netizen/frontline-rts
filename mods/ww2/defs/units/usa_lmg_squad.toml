# Light MG Section (S4): the T/O&E 7-17 light machine gun squad of five with
# one M1919A4 on its tripod, replacing the S1-S3 MG Team (which fielded three
# M1919s, S4-2 (A)): the squad leader (M1), the gunner (M1919A4 and an
# M1911A1), the assistant gunner (M1911A1) and two ammo bearers with M1
# carbines (S4-3 (A)).
# Sources: battleorder.org "U.S. Army Rifle Company 1944" (T/O&E 7-17,
# 26 Feb 1944: LMG section = HQ 2 + 2 squads of 5).
id = "ww2:usa_lmg_squad"
name = "Light MG Section"
short_name = "Light MG"
faction = "ww2:usa"
tags = ["mg"]
capabilities = ["recrew"]
sources = ["battleorder.org, U.S. Army Rifle Company 1944 (T/O&E 7-17, LMG squad)"]
# S4 Tune: 200 -> 280. Five men and an M1919A4 on a tripod were the best-value card of the game
# (bought 5 times a match at 200); at 280 the AI still buys it in every match. Measured in docs/slices/S4-variants.md
# "Tune results" (160 matches, seeds 1-80 x both bases).
# S4 review: this prices the card's measured strength, not its weapon. On
# paper the MG 42 tripod (sMG-Gruppe, 195) fires faster (about 580 rpm
# effective vs 340 here), yet the US card costs more per man (56 vs 32.5).
# Why the US section outperforms is not modelled yet (likely the Garand
# riflemen around it and the AI buying it as a line card); open as S4-41.
cost = 280
cooldown_s = 30
unlock_s = 0
speed_cm_s = 260
sight_m = 150
spacing_dm = 25
dig_rate_pct = 0

[[members]]
slot = "squad_leader"
weapon = "ww2:m1_garand"
traits = ["leader"]

[[members]]
slot = "mg_gunner"
weapon = "ww2:m1919a4_tripod"
sidearm = "ww2:m1911a1"
traits = ["crew_gunner"]

[[members]]
slot = "mg_assistant"
weapon = "ww2:m1911a1"
traits = ["crew_assistant"]

[[members]]
slot = "ammo_bearer"
count = 2
weapon = "ww2:m1_carbine"
traits = ["ammo_bearer"]
