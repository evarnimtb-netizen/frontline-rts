# Sanitätstrupp (S12 Build B): two stretcher-bearer medics (Krankenträger)
# with pistols. Medics stabilise downed men near them on their own (W6),
# carry them on a stretcher together (W7) and build and staff the aid post
# (defs/supply/ger_verwundetennest.toml, W8). Each P 38 carries its
# weapon's `load` (16 rounds; no `rounds` key needed): the card counts
# rounds like every other card. No mix tag and ai_weight 0: the AI buys
# none until S12b (docs/slices/S12-wounds-medics.md 5).
id = "ww2:ger_sanitaetstrupp"
name = "Sanitätstrupp"
short_name = "Sanitäter"
faction = "ww2:germany"
tags = ["medic"]
capabilities = ["dig_basic"]
sources = [
    "US War Department TM-E 30-451, Handbook on German Military Forces (1945): company stretcher bearers (Krankenträger) and medical NCOs",
    "infantry-structures.md 5, 7.3; roster-expansion.md S12 (Sanitätstrupp, 2 men, P 38)",
]
# docs/slices/S12-wounds-medics.md S12-11 (A): 80 MP with the S5a-37 German
# cut and the S6 factor (80 x 0.8 x 1.033 = 66).
cost = 66
cooldown_s = 30
unlock_s = 0
ai_weight = 0
speed_cm_s = 290
sight_m = 150
spacing_dm = 30
dig_rate_pct = 100

[[members]]
slot = "leader"
weapon = "ww2:p38"
traits = ["leader", "medic"]

[[members]]
