# Aid Station (S12 W8): the forward aid post, a tent on a shallow scrape.
# Built by the Aid Men (tag "medic"). It works while two own medics stand
# in its radius with no move order: a stabilised downed man in the radius
# is evacuated, a detached wounded man not yet treated is treated and
# returns to the fight; beds fill by ascending id. HE that breaks the tent
# destroys the post (S6-14). No stock, no cook-off.
# docs/slices/S12-wounds-medics.md 2, 4 (W8, W9).
