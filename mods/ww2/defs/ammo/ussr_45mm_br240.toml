# 45 mm BR-240: armour-piercing high-explosive with a ballistic cap for the 45 mm M-42 (S15 Build C, S15-ussr.md 6.3); a small filler (unverified).
id = "ww2:ussr_45mm_br240"
name = "45 mm BR-240"
mechanism = "aphe"
# S15: priced refill ([supply] shell_mp_per_t per tonne): complete round about 2.85 kg (unverified: S15 starting value)
supply = { kind = "shells", g = 2850 }
caliber_mm = 45
muzzle_velocity_m_s = 870
drag_coeff = 0
# Penetration convention (S15 Build C): the mod's tables are [range_m, mm] at pen_reference_angle_deg
# (here 0, the normal). Soviet tables give the 'meet angle 90 deg' column (the normal) at a 75 %
# success criterion (Soviet method); that column is taken as the 0-degree row, mm unchanged: no
# criterion factor was read in a source, so the rows sit slightly low against the 50 % tables.
# Unverified: about 61 mm at 500 m at 0 deg (S15-research-history.md 5, not read in a source); the other rows are spaced as the ZiS-3's (S15 starting values).
penetration = [[100, 71], [500, 61], [1000, 51], [1500, 42]]
pen_reference_angle_deg = 0
ricochet_angle_deg = 70
# S13 O1: the slope penalty beyond 1/cos, class "apcbc".
slope_class = "apcbc"
nonpen_damage = 40
track_damage = 60
sources = [
  "Wikipedia, 45 mm anti-tank gun M1942 (M-42): AP 1.43 kg at 870 m/s, APCR 0.85 kg, fragmentation 2.14 kg; its penetration table is empty, read 2026-11-26",
  "S15-research-history.md 5: penetration about 61 mm at 500 m (unverified)",
]

[core]
damage = 80
length_cm = 120
max_boxes = 2

[spall]
rays = 4
damage = 25
cone_deg = 25

# Filler rays and damage: S15 starting values on the S13 pattern (the round's filler in its comment).
[filler]
offset_cm = 100
rays = 4
cone_deg = 60
damage = 60
reach_cm = 200
