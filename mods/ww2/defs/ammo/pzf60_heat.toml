# Panzerfaust 60 warhead (S4, owner question S3c-29 (A)): a shaped charge,
# fired by `ww2:pzf60` (the item `ww2:panzerfaust60`). Physical like the
# Panzerschreck's rocket: a ballistic round at constant speed, the jet and
# the spall do the damage; it flies a real arc (45 m/s: ~8.7 m drop over
# 60 m, compensated exactly).
# Sources: Wikipedia "Panzerfaust" citing Rottman, "Panzerfaust and
# Panzerschreck" (2014): 149 mm warhead, 45 m/s, 200 mm penetration.
id = "ww2:pzf60_heat"
name = "Panzerfaust 60 warhead"
mechanism = "heat"
caliber_mm = 149
muzzle_velocity_m_s = 45
drag_coeff = 0
# Flat at 0°: a shaped charge does not lose penetration with range (mm).
penetration = [[0, 200]]
ricochet_angle_deg = 80
# Damage to the gun when it strikes the barrel box (physical contact).
nonpen_damage = 30
track_damage = 50
sources = ["Wikipedia, Panzerfaust (citing Rottman 2014): calibre, velocity, penetration"]

# The jet, as the RPzB round's (reasoning: similar charge class): damage to
# each box it crosses within 1.0 m behind the plate, at most 3 boxes.
[core]
damage = 120
length_cm = 100
max_boxes = 3

# Behind-armour debris, as the RPzB round's (7 rays, 25 each).
[spall]
rays = 7
damage = 25
cone_deg = 25

# The warhead's blast and its thin body's fragments (as the RPzB round's;
# the larger charge mostly goes into the jet).
[he]
damage = 100
suppression = 20
blast_radius_cm = 60
frag_count = 24
frag_reach_cm = 600
frag_damage = 50
frag_far_pct = 30
frag_elev_deg = [2, 45]
frag_track_damage = 1
suppression_radius_m = 6
crater_radius_cm = 40
crater_depth_cm = 20
pen_mm = 0
vs_vehicle_pct = 40
