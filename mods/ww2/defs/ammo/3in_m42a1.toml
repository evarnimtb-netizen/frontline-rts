# 3-inch M42A1 HE for the 3-inch M7 gun of the M10 (S7,
# docs/slices/S7-casemate-td.md 5). Bursts on contact.
id = "ww2:3in_m42a1"
name = "3-inch M42A1 HE"
mechanism = "he"
# S5a priced refill: complete round 10.9 kg (24 lb; Hunnicutt, 3-inch
# ammunition table; verify).
supply = { kind = "shells", g = 10900 }
caliber_mm = 76
# 2,800 ft/s (Hunnicutt): 853 m/s.
muzzle_velocity_m_s = 853
drag_coeff = 0
# As the M48 (a thin-walled HE shell): flat 10 mm, the blast's pen_mm.
penetration = [[0, 10]]
ricochet_angle_deg = 80
track_damage = 40
sources = [
  "Hunnicutt, Sherman: A History of the American Medium Tank (1978), 3-inch ammunition data",
]

# The M48's HE values (75mm_m48.toml, S3b physical-contact rule) scaled to
# the lighter shell: filler 0.86 lb TNT against the M48's 1.47 lb (verify),
# so blast_radius_cm 120 x (0.86 / 1.47)^(1/3) = 100; body 12.9 lb against
# 14.6 lb, so frag_count 80 x 0.88 = 70. The rest as the M48 (starting
# values; units as there: cm, %, degrees, m).
[he]
damage = 150
suppression = 40
blast_radius_cm = 100
frag_count = 70
frag_reach_cm = 1200
frag_damage = 70
frag_far_pct = 30
frag_elev_deg = [2, 45]
frag_track_damage = 1
suppression_radius_m = 12
crater_radius_cm = 60
crater_depth_cm = 30
pen_mm = 10
# S8a thin-plate rule (S7-8, owner question S8a-13 (A)): a fragment of the
# 3-inch M42A1 pierces a plate whose effective thickness (thickness x material
# / cos) is below this many mm at the burst, falling with distance as
# frag_damage does (verify: starting value).
frag_pen_mm = 12
inside_damage = 150
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 40
