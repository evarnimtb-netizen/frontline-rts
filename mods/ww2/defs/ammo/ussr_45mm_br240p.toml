# 45 mm BR-240P: APCR (a tungsten core) for the 45 mm M-42 (S15 Build C); rare. Projectile 0.85 kg (Wikipedia, read).
id = "ww2:ussr_45mm_br240p"
name = "45 mm BR-240P"
mechanism = "ap"
# S15: priced refill ([supply] shell_mp_per_t per tonne): complete round about 2.3 kg (unverified: S15 starting value)
supply = { kind = "shells", g = 2300 }
caliber_mm = 45
muzzle_velocity_m_s = 1070
drag_coeff = 0
# Penetration convention (S15 Build C): the mod's tables are [range_m, mm] at pen_reference_angle_deg
# (here 0, the normal). Soviet tables give the 'meet angle 90 deg' column (the normal) at a 75 %
# success criterion (Soviet method); that column is taken as the 0-degree row, mm unchanged: no
# criterion factor was read in a source, so the rows sit slightly low against the 50 % tables.
# Read: 81 mm at 500 m (armytanks.org, no angle given: taken as the normal); the 100 and 1000 m rows are unverified S15 starting values.
penetration = [[100, 95], [500, 81], [1000, 62]]
pen_reference_angle_deg = 0
ricochet_angle_deg = 70
# S13 O1: the slope penalty beyond 1/cos, class "apcr".
slope_class = "apcr"
nonpen_damage = 40
track_damage = 60
sources = [
  "Wikipedia, 45 mm anti-tank gun M1942 (M-42): AP 1.43 kg at 870 m/s, APCR 0.85 kg, fragmentation 2.14 kg; its penetration table is empty, read 2026-11-26",
  "armytanks.org (M1942 45 mm): BR-240P 1,070 m/s, 81 mm at 500 m, read 2026-11-26",
]
# S5a (D3): a rare round: refilled one per supply.rare_rearm_base_s up to the vehicle's rare_cap, never a weapon's only feed.
rare = true

[core]
damage = 80
length_cm = 100
max_boxes = 2

[spall]
rays = 4
damage = 25
cone_deg = 25
