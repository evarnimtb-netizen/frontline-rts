# 105 mm M1 HE for the 105 mm Howitzer M3 (S11a1 C4; docs/design/roster/
# artillery-on-map.md 2.2 "M1 HE (15 kg, about 2.2 kg TNT)"). Blast,
# fragments, suppression and crater are the 75 mm Sprgr 34 values scaled by
# the cube root of the filler ratio 2.2 / 0.7 (= 1.46; spec S11a1.md 4 C4);
# 160 fragment rays from D 6.5; frag_damage, frag_far_pct and pen_mm unchanged.
id = "ww2:105mm_m1_he"
name = "105 mm M1 HE"
mechanism = "he"
# S5a: priced refill: complete round 19 kg (spec C4; the design's 15 kg is the
# projectile; verify).
supply = { kind = "shells", g = 19000 }
caliber_mm = 105
# The top charge of the M3 (charges 205-311 m/s, spec C2; verify).
muzzle_velocity_m_s = 311
drag_coeff = 0
# Flat: beats no plate of either S3 tank (as the Sprgr 34).
penetration = [[0, 10]]
ricochet_angle_deg = 80
track_damage = 40
sources = ["artillery-on-map.md 2.2, 6.5 (public tables, verify)", "75mm_sprgr34 [he] block scaled by 1.46"]

[he]
damage = 150
suppression = 40
# S3b physical-contact rule: no radial damage. Overpressure to a man within
# blast_radius_cm with a clear line: 120 x 1.46 = 175 cm.
blast_radius_cm = 175
# Fragments: 160 rays (D 6.5), reach 1200 x 1.46 = 1750 cm; damage and
# fall-off as the 75 mm (spec C4).
frag_count = 160
frag_reach_cm = 1750
frag_damage = 70
frag_far_pct = 30
frag_elev_deg = [2, 45]
frag_track_damage = 1
# 12 x 1.46 = 17.5, rounded up to 18 m (spec C4).
suppression_radius_m = 18
# Crater: 60 x 1.46 = 88, 90 cm (spec C4); depth 30 x 1.46 = 44 cm (the same
# scaling; the spec names no depth).
crater_radius_cm = 90
crater_depth_cm = 44
pen_mm = 10
# S8a thin-plate rule: as the 75 mm (verify: starting value).
frag_pen_mm = 12
inside_damage = 150
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 40
