# 8.8 cm PzGr 39: APCBC-HE for the Tiger's KwK 36 L/56 (S13a). 59 g filler.
id = "ww2:88mm_pzgr39"
name = "8.8 cm PzGr 39"
mechanism = "aphe"
# S13: priced refill ([supply] shell_mp_per_t per tonne): complete round about 15.3 kg (verify: projectile 10.2 kg plus the case, from memory).
supply = { kind = "shells", g = 15300 }
caliber_mm = 88
muzzle_velocity_m_s = 773
drag_coeff = 0
# [range_m, mm] against rolled homogeneous plate at 0 degrees, 50 % criterion; 8.8 cm KwK 36 L/56.
penetration = [[100, 162], [500, 151], [1000, 138], [1500, 126], [2000, 116]]
pen_reference_angle_deg = 0
ricochet_angle_deg = 70
# S13 O1 (docs/slices/S13-heavy-wave.md 3): the slope penalty beyond 1/cos, class "apcbc".
slope_class = "apcbc"
nonpen_damage = 40
track_damage = 60
sources = [
  "Bird & Livingston, WWII Ballistics: Armor and Gunnery (2001) p. 61, via the Wikipedia calculated-penetration table (90 degrees, US/UK 50 % criterion) of the gun (8.8 cm KwK 36)",
  "Wikipedia, 8.8 cm KwK 36 (773-780 m/s, projectile 10.2 kg, 59 g filler, H.Dv. 481/60); complete round mass about 15.3 kg is from memory (verify)",
]

[core]
damage = 100
length_cm = 170
max_boxes = 3

[spall]
rays = 6
damage = 35
cone_deg = 25

[filler]
offset_cm = 100
rays = 10
cone_deg = 60
damage = 60
reach_cm = 300
