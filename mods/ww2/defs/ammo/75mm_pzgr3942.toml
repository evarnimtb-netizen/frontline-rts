# 7.5 cm PzGr 39/42: APCBC-HE for the Panther's KwK 42 L/70 (S13a, docs/slices/S13-heavy-wave.md 4.1). 18 g RDX filler.
id = "ww2:75mm_pzgr3942"
name = "7.5 cm PzGr 39/42"
mechanism = "aphe"
# S13: priced refill ([supply] shell_mp_per_t per tonne): complete round 14.3 kg.
supply = { kind = "shells", g = 14300 }
caliber_mm = 75
muzzle_velocity_m_s = 935
drag_coeff = 0
# [range_m, mm] against rolled homogeneous plate at 0 degrees, 50 % criterion; 7.5 cm KwK 42 L/70.
penetration = [[100, 185], [500, 168], [1000, 149], [1500, 132], [2000, 116]]
pen_reference_angle_deg = 0
ricochet_angle_deg = 70
# S13 O1 (docs/slices/S13-heavy-wave.md 3): the slope penalty beyond 1/cos, class "apcbc".
slope_class = "apcbc"
nonpen_damage = 40
track_damage = 60
sources = [
  "Bird & Livingston, WWII Ballistics: Armor and Gunnery (2001) p. 61, via the Wikipedia calculated-penetration table (90 degrees, US/UK 50 % criterion) of the gun (7.5 cm KwK 42)",
  "Wikipedia, 7.5 cm KwK 42 (muzzle velocity 935 m/s, round 14.3 kg, 18 g filler); wwiitanks.co.uk gun data 148",
]

[core]
damage = 100
length_cm = 150
max_boxes = 3

[spall]
rays = 6
damage = 35
cone_deg = 25

[filler]
offset_cm = 100
