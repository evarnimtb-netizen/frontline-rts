# 57 mm BR-271: APCBC with a 14 g filler (Wikipedia, read) for the ZiS-2 (S15 Build C); projectile 3.14 kg, up to 990 m/s.
id = "ww2:ussr_57mm_br271"
name = "57 mm BR-271"
mechanism = "aphe"
# S15: priced refill ([supply] shell_mp_per_t per tonne): complete round about 6.6 kg (unverified: S15 starting value)
supply = { kind = "shells", g = 6600 }
caliber_mm = 57
muzzle_velocity_m_s = 990
drag_coeff = 0
# Penetration convention (S15 Build C): the mod's tables are [range_m, mm] at pen_reference_angle_deg
# (here 0, the normal). Soviet tables give the 'meet angle 90 deg' column (the normal) at a 75 %
# success criterion (Soviet method); that column is taken as the 0-degree row, mm unchanged: no
# criterion factor was read in a source, so the rows sit slightly low against the 50 % tables.
# Read: BR-271 APCBC, meet angle 90 deg column (Wikipedia ZiS-2).
penetration = [[100, 114], [300, 109], [500, 103], [1000, 91], [1500, 79], [2000, 69]]
pen_reference_angle_deg = 0
ricochet_angle_deg = 70
# S13 O1: the slope penalty beyond 1/cos, class "apcbc".
slope_class = "apcbc"
nonpen_damage = 40
track_damage = 60
sources = [
  "Wikipedia, 57 mm anti-tank gun M1943 (ZiS-2): ammunition and penetration tables (Soviet method, 75 %), read 2026-11-26",
]

[core]
damage = 100
length_cm = 130
max_boxes = 3

[spall]
rays = 6
damage = 30
cone_deg = 25

# Filler rays and damage: S15 starting values on the S13 pattern (the round's filler in its comment).
[filler]
offset_cm = 100
rays = 4
cone_deg = 60
damage = 60
reach_cm = 250
