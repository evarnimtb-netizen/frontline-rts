    "ww2:ussr_su85_squad",
    "ww2:ussr_su76m_squad",
    "ww2:ussr_m3a1_scout_squad",
    "ww2:ussr_ba64b_squad",
    "ww2:ussr_is2_squad",
]
# Squads on the field at tick 0: two rifle sections and the sappers.
start_squads = ["ww2:ussr_strelkovoe_otdelenie", "ww2:ussr_strelkovoe_otdelenie", "ww2:ussr_sapyornoe_otdelenie"]
