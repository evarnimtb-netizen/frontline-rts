# S10b anti-tank mine (R4, R5): laid by an AT minefield, never carried in a
# kit. An enemy vehicle with the mine within trigger_cm of a track
# centreline or a wheel sets it off; men never. The burst breaks the tracks
# over it (damage 400 x vs_vehicle_pct on anchors within blast_radius_cm;
# track hp 100). Values verify; the other [he] keys as the Geballte
# Ladung's.
id = "ww2:at_mine"
name = "AT mine (Teller 43 / M1A1)"
kind = "mine"
supply = { kind = "explosives", g = 9000 }
range_m = 1
windup_ms = 0
scatter_pct = 0

[mine]
trigger = "vehicle"
trigger_cm = 40

[he]
damage = 400
suppression = 80
blast_radius_cm = 150
frag_count = 32
frag_reach_cm = 800
frag_damage = 80
frag_far_pct = 30
frag_elev_deg = [2, 40]
frag_track_damage = 1
suppression_radius_m = 18
crater_radius_cm = 150
crater_depth_cm = 90
pen_mm = 30
inside_damage = 300
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 100
