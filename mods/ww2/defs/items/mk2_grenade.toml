# US fragmentation grenade (S1b abilities). Values are starting points for
# tuning (docs/slices/S1b-abilities.md "Items").
id = "ww2:mk2_grenade"
name = "Mk 2 Grenade"
kind = "frag"
min_range_m = 5
range_m = 30
windup_ms = 1000
# From the start of the throw; it never goes off before it lands.
fuse_ms = 4000
# Landing point scatter, percent of the throw distance.
scatter_pct = 6

[he]
damage = 150
suppression = 50
lethal_radius_cm = 200
damage_radius_cm = 600
suppression_radius_m = 10
crater_radius_cm = 50
crater_depth_cm = 20
# Against vehicles (S3): armour it defeats on contact (mm), the inner burst
# if it does, and damage to track anchors in its lethal radius (10 % of
# its damage). Blasts never reach a closed vehicle's insides.
pen_mm = 2
inside_damage = 100
inside_radius_cm = 100
vs_vehicle_pct = 10
