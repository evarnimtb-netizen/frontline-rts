# S10b anti-personnel mine (R3, R6): laid by an AP minefield, never carried
# in a kit. An enemy man on foot within trigger_cm sets it off; vehicles
# never. A ground burst; damage, blast and fragments verify. The other [he]
# keys as the Geballte Ladung's.
id = "ww2:ap_mine"
name = "AP mine (Schu-mine 42 / M2)"
kind = "mine"
supply = { kind = "explosives", g = 4000 }
range_m = 1
windup_ms = 0
