# S10a: German Bangalore torpedo (gestreckte Ladung: explosive in a pipe
# pushed under the wire). Placed, not thrown (`PlaceBangalore`): the man
# walks to within 2 m of the target, works `place_s`, lays the charge from
# his spot toward the target; it bursts `bursts` times along `length_cm`
# when the fuse (from the lay) runs out. All values are starting values
# (verify); the [he] is the satchel's (S1b) with a 150 cm blast radius and no
# trench cut (docs/slices/S10a-fortifications.md 3.5).
id = "ww2:gestreckte_ladung"
name = "Gestreckte Ladung"
kind = "bangalore"
# S5a: priced refill in the base. About 13 kg of explosive and pipe (verify).
supply = { kind = "explosives", g = 13000 }
# Placed: the range keys are unused (the man walks to the spot).
min_range_m = 0
range_m = 3
windup_ms = 0
fuse_ms = 8000
scatter_pct = 0

[bangalore]
length_cm = 300
bursts = 3
place_s = 5

[he]
damage = 300
suppression = 80
blast_radius_cm = 150
frag_count = 32
frag_reach_cm = 800
frag_damage = 80
frag_far_pct = 30
frag_elev_deg = [2, 40]
frag_track_damage = 1
suppression_radius_m = 18
crater_radius_cm = 150
crater_depth_cm = 90
cuts_trenches = false
pen_mm = 30
inside_damage = 300
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 100
