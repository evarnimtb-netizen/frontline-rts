# Panzerfaust 60 as fired (S4, owner question S3c-29 (A)): the weapon the
# single-shot item `ww2:panzerfaust60` fires as. Not carried as a member
# weapon. Physical like the Panzerschreck: a HEAT round with a jet and
# spall flies a real arc; no hit chance, no damage table.
# Sources: Wikipedia "Panzerfaust" citing Rottman, "Panzerfaust and
# Panzerschreck" (2014): 60 m, 45 m/s, 200 mm; full production from
# September 1944.
id = "ww2:pzf60"
name = "Panzerfaust 60"
short_name = "Panzerfaust"
class = "launcher"
sources = ["Wikipedia, Panzerfaust (citing Rottman 2014): range, velocity, penetration"]
# Farthest shot (m).
range_m = 60
damage = 300
rounds_per_min = 6
magazine = 1
# Spent tube: no reload (one shot per item).
reload_ms = 0
# Dispersion half-angle (mrad): a simple leaf sight.
spread_mrad = 15
# Must match the round's speed (m/s).
muzzle_velocity_m_s = 45
suppression = 20
# Opens fire on a vehicle standing still within 60 m, a moving one (over
# 1 m/s) within 40 m (the slow round drops ~8.7 m over 60 m: aim is
# drop-compensated exactly, there is no drag).
engage_still_m = 60
engage_moving_m = 40
# The backblast gives the firer away (% sight range against him, ms).
fire_reveal_pct = 300
fire_reveal_ms = 3000
ammo = "ww2:pzf60_heat"
# One tube (the item counts them; this is the launcher rule's minimum).
rounds_carried = 1
handover_ms = 0
