# 105 mm Howitzer M3 (S11a1 C2; docs/design/roster/artillery-on-map.md 2.2, 4.5):
# the US Cannon Company howitzer. It cannot fire high-angle (max +30 deg).
# Rounds are on the vehicle mount. The direct fire line is the S9 guns'
# (600 m, 2500 urad); the [indirect] table is the fire-mission solver.
id = "ww2:m3_105mm"
name = "105 mm Howitzer M3"
class = "cannon"
# Direct engagement range, m (as the S9 guns; Build B contract).
range_m = 600
# A direct hit on a man, HP (as the S9 guns).
damage = 300
# 3 rounds/min sustained (artillery-on-map.md 2.2 "2-3 / 4"; verify).
rounds_per_min = 3
magazine = 1
# Reload, ms: 60 s / 3 (verify).
reload_ms = 20000
# 2.5 mrad, urad (as the S9 guns; verify).
spread_urad = 2500
# Top charge, m/s (the [indirect] charge V; verify).
muzzle_velocity_m_s = 311
suppression = 25
# Muzzle blast and dust: as the S9 guns (verify).
fire_reveal_pct = 300
fire_reveal_ms = 5000

[indirect]
# Charges I-V, m/s (spec S11a1.md 4 C2; verify).
charges_m_s = [205, 220, 240, 270, 311]
# Laying band, deg (artillery-on-map.md 2.2 "-9 to +30"; the solver band 0..30).
elevation_deg = [0, 30]
# Low and high roots (S11a1 G2); the band keeps it low-angle only.
low_angle = true
# Maximum range, m (artillery-on-map.md 2.2 "about 7,600 m").
range_m = 7600
# Round scatter, mrad (spec C2; a game value, verify).
spread_mrad = 6
