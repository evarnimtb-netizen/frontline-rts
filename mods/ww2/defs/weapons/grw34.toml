id = "ww2:grw34"
name = "8 cm GrW 34"
class = "mortar"
sources = [
    "US War Department, German Infantry Weapons (MID 1943), 8-cm heavy mortar model 34 (charges I-IV 246/344/427/499 ft/s, range 60-1,900 m, firing table 869-1,545 mils, rate)",
    "Wikipedia, 8 cm Granatwerfer 34 (174 m/s full charge, 2.4 km)",
]
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:8cm_wgr34"
# Bombs the gunner carries; the crew carry the rest (members' `rounds`;
# 15 a team in S5a, owner question S5a-16 (A)).
load = 3
min_range_m = 60
range_m = 600
damage = 150
# Practical sustained rate: "6 rounds in 8 to 9 seconds (but this rate
# cannot be maintained)" (US War Department, German Infantry Weapons, 1943,
# 8-cm heavy mortar model 34).
rounds_per_min = 15
magazine = 1
reload_ms = 0
# S5b: the PRECISION spread only (mrad, triangular per axis around the aim
# point; a game value, S5b-6 (A)). The aim error (where the group lands) is
# the fire mission's: rules [fire_mission] first_round_error_pct and
# map_fire_error_pct, shrinking as an observer sees rounds land.
spread_mrad = 50
# Full charge (charge V) muzzle velocity (m/s); the flight uses [indirect].
muzzle_velocity_m_s = 174
setup_ms = 3000
suppression = 30

# S5b: high-angle fire. The charge solver takes the lowest charge that
# reaches the target at an elevation inside elevation_deg; the bomb flies
# drag-free (as every sim shell) and lands after the true time of flight.
[indirect]
# Charges I-IV of the Wgr 34: 246 / 344 / 427 / 499 ft/s = 75 / 105 / 130 /
# 152 m/s (US War Department, German Infantry Weapons, 1943, section e).
# Charge V 174 m/s is the full-charge figure most sources quote (Wikipedia,
# 8 cm Granatwerfer 34; verify). Check: charge I at 87 deg reaches 60 m
# drag-free, the firing table's first row and min_range_m. Inside 560 m
# charge I is used (13-15 s of flight), charge II beyond.
charges_m_s = [75, 105, 130, 152, 174]
# Laying limits (whole degrees): the firing table runs 869-1,545 mils
# (48.9-86.9 deg at 6,400 mils to the circle); 45-87 taken (verify).
elevation_deg = [45, 87]

[he]
# S3b physical-contact rule (docs/slices/S3b-balance.md "Fragments and
# blasts"): no radial damage. An 81 mm mortar bomb (about 0.6 kg TNT, thin
# cast casing: many small fragments).
# Overpressure: full `damage` to a man within blast_radius_cm with a clear
# line from the burst (about the old lethal radius or less), and the
# vs_vehicle_pct share to track anchors within it (cm).
blast_radius_cm = 150
# Fragments: frag_count rays per burst (azimuth stratified, elevation in
# frag_elev_deg [min, max] above the ground plane, degrees), each stopping
# at the first man, vehicle, wreck or earth within frag_reach_cm (cm). One
# fragment deals frag_damage to a man near the burst, falling linearly to
# frag_far_pct % of it at full reach, and frag_track_damage to a track whose
# band it strikes. Starting values from the spec, set to keep the old
# lethality in the open within about 20 % (the Tune stage measures it).
# S3b Tune (owner question S3b-23 (A)): frag_count 96 -> 120. With 96 a
# 10-round barrage killed 58 men in the open in fortify-test (the S1 value
# before fragments was 74, -22 %); 120 gives 60 (-19 %, inside the spec's
# +-20 %) and the trench still loses 6 (10 %). A real 81 mm bomb throws
# hundreds of fragments; the rays are a sample.
frag_count = 120
frag_reach_cm = 1500
frag_damage = 70
frag_far_pct = 30
frag_elev_deg = [2, 50]
# frag_track_damage: 1, not the spec's starting 5 (2 for grenades): a burst
# 1 m beside a hull sends about 20 fragments into that side's track band,
# and 5 each broke the track on top of the overpressure (old behaviour:
# only the overpressure broke tracks). Track links shrug off fragments.
frag_track_damage = 1
suppression_radius_m = 15
crater_radius_cm = 200
crater_depth_cm = 70
# Against vehicles (S3): armour it defeats on contact (mm), the inner burst
# if it does, and damage to track anchors within blast_radius_cm (40 % of
# its damage). Blasts never reach a closed vehicle's insides.
pen_mm = 8
# S8a thin-plate rule (S7-8, owner question S8a-13 (A)): a fragment of the
# 8 cm Wgr 34 pierces a plate whose effective thickness (thickness x material
# / cos) is below this many mm at the burst, falling with distance as
# frag_damage does (verify: starting value).
frag_pen_mm = 9
inside_damage = 150
# S3b: when it beats a plate, inside_rays fragment rays from the contact
# point into the hull, inside_damage each to the first box within
# inside_reach_cm (cm), instead of a radius.
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 40
