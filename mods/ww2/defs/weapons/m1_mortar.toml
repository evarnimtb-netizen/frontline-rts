id = "ww2:m1_mortar"
name = "81 mm M1"
class = "mortar"
sources = [
    "Wikipedia, M1 mortar (18 rpm sustained, 30-35 maximum; M43A1 light HE 3.2 kg, 100-3,300 yd, zone 7)",
    "M43A1 dealer description, ima-usa.com (ignition cartridge plus six increments; secondary)",
]
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:81mm_m43a1"
# Bombs the gunner carries; the crew carry the rest (members' `rounds`).
load = 3
# S5b: 60 -> 90 m. The M43A1 light HE's minimum is 100 yd (91 m) (Wikipedia,
# M1 mortar); the lowest zone at 85 deg reaches 87 m drag-free.
min_range_m = 90
range_m = 600
damage = 150
# S5b: 15 -> 18, "18 rpm sustained", 30-35 maximum (Wikipedia, M1 mortar).
rounds_per_min = 18
magazine = 1
reload_ms = 0
# S5b: the PRECISION spread only (mrad; a game value, S5b-6 (A)); the aim
# error is the fire mission's (rules [fire_mission]).
spread_mrad = 50
# Nominal (unused for the flight, which uses [indirect]).
muzzle_velocity_m_s = 180
setup_ms = 3000
suppression = 30

# S5b: high-angle fire (see grw34.toml).
[indirect]
# M43A1 light HE: 7 zones (ignition cartridge plus 0-6 increments); zone 7
# reaches about 3,300 yd (Wikipedia, M1 mortar). Per-zone velocities are NOT
# sourced yet: an estimate rising from 70 m/s (ignition cartridge alone,
# like the GrW 34's charge I) to 188 m/s (owner question S5b-2 (A)). To
# check: "Firing tables, mortar, 81-mm, M1, firing shell, H.E., M43A1",
# War Department, Jan. 1945. Only zones 1-2 are used inside 600 m.
charges_m_s = [70, 95, 117, 137, 155, 172, 188]
# Laying limits (whole degrees; verify against FM 23-90).
elevation_deg = [45, 85]

[he]
# S3b physical-contact rule (docs/slices/S3b-balance.md "Fragments and
# blasts"): no radial damage. An 81 mm mortar bomb (about 0.6 kg TNT, thin
# cast casing: many small fragments).
# Overpressure: full `damage` to a man within blast_radius_cm with a clear
# line from the burst (about the old lethal radius or less), and the
# vs_vehicle_pct share to track anchors within it (cm).
blast_radius_cm = 150
# Fragments: frag_count rays per burst (azimuth stratified, elevation in
# frag_elev_deg [min, max] above the ground plane, degrees), each stopping
# at the first man, vehicle, wreck or earth within frag_reach_cm (cm). One
# fragment deals frag_damage to a man near the burst, falling linearly to
# frag_far_pct % of it at full reach, and frag_track_damage to a track whose
# band it strikes. Starting values from the spec, set to keep the old
# lethality in the open within about 20 % (the Tune stage measures it).
# S3b Tune (owner question S3b-23 (A)): frag_count 96 -> 120. With 96 a
# 10-round barrage killed 58 men in the open in fortify-test (the S1 value
# before fragments was 74, -22 %); 120 gives 60 (-19 %, inside the spec's
# +-20 %) and the trench still loses 6 (10 %). A real 81 mm bomb throws
# hundreds of fragments; the rays are a sample.
frag_count = 120
frag_reach_cm = 1500
frag_damage = 70
frag_far_pct = 30
frag_elev_deg = [2, 50]
# frag_track_damage: 1, not the spec's starting 5 (2 for grenades): a burst
# 1 m beside a hull sends about 20 fragments into that side's track band,
# and 5 each broke the track on top of the overpressure (old behaviour:
# only the overpressure broke tracks). Track links shrug off fragments.
frag_track_damage = 1
suppression_radius_m = 15
crater_radius_cm = 200
crater_depth_cm = 70
# Against vehicles (S3): armour it defeats on contact (mm), the inner burst
# if it does, and damage to track anchors within blast_radius_cm (40 % of
# its damage). Blasts never reach a closed vehicle's insides.
pen_mm = 8
inside_damage = 150
# S3b: when it beats a plate, inside_rays fragment rays from the contact
# point into the hull, inside_damage each to the first box within
# inside_reach_cm (cm), instead of a radius.
inside_rays = 16
inside_reach_cm = 150
vs_vehicle_pct = 40
