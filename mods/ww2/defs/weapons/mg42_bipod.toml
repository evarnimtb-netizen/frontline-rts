# MG 42 on its bipod (S4): the Grenadiergruppe's light MG, carried and fired
# by the MG-Schütze 1 with the squad; it moves with the squad and fires in
# short bursts. The tripod gun (Lafette 42) is `ww2:mg42`.
# Sources: Wikipedia "MG 42" (11.6 kg with bipod; cyclic ~1,200 rpm; 740 m/s
# with the s.S. round; 50-round Gurttrommel drum; US comparative tests:
# the bipod gun fired in bursts of 3-7 rounds). Game ranges are compressed
# (rifles 300 m): the bipod/tripod gap is kept as a ratio, not the real
# 2-3 km.
id = "ww2:mg42_bipod"
name = "MG 42 (bipod)"
short_name = "MG 42"
class = "mg"
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:792x57_belt"
# The gunner's own load: the drum on the gun. The team's belts are carried
# by the assistant and the ammo bearer (members' `rounds`).
load = 50
sources = [
    "Wikipedia, MG 42 (weight, cyclic rate, muzzle velocity, drum, burst length)",
]
# Effective reach on the compressed scale (m): 1.5 x a rifle's 300 m.
range_m = 450
# Damage per hit (the same 7.92 mm round as the Kar98k's, at MG range).
damage = 45
# Cyclic rate (rpm): ~1,200.
rounds_per_min = 1200
# Rounds between reloads: the 50-round drum (Gurttrommel 34).
magazine = 50
# A drum change (ms).
reload_ms = 5000
# Dispersion half-angle (mrad): wider than the tripod's 12 (no traverse and
# elevation mechanism, fired off the bipod).
spread_mrad = 22
# m/s (s.S. ball).
muzzle_velocity_m_s = 740
# S8a (vehicles.md 6.4, owner question S8a-3 (A)): small arms against thin
# armour. The belt's SmK (steel-core AP) table stands for every round (no
# belt-mix roll): mm of RHA beaten at 0 deg, [range_m, mm], linear between
# rows, flat past the last (verify: SmK about 13 mm at 100 m on period
# German tables; quoted from memory).
penetration = [[0, 13], [100, 11], [300, 7], [600, 4]]
# A round past the plate goes on length_cm and strikes at most max_boxes
# boxes inside (crew, riders, components) for damage HP each; no spall.
core = { damage = 35, length_cm = 40, max_boxes = 1 }
# Down on the bipod and aimed (ms): a second.
setup_ms = 1000
# Suppression per near miss (out of 100).
suppression = 15
# A crew weapon: when the gunner falls, his assistant (or the nearest man,
# ammo bearers first) takes the gun up after this long (ms).
handover_ms = 3000
# S5a bursts (B1): 7 rounds (0.35 s at 1,200 rpm), then a 1.0 s pause to
# re-lay: about 300 rounds a minute in steady fire (German MG drill of short
# bursts of 5-7 rounds as summarised in secondary sources; US comparative
# tests saw bursts of 3-7, Wikipedia "MG 42"; verify against the drill).
burst_rounds = 7
burst_pause_ms = 1000
