# MG 42 on the Lafette 42 tripod (S4): the sMG-Gruppe's sustained-fire gun.
# Same id as the S1-S3 MG team's gun so legacy mods keep loading; S4 gives
# it its tripod values. The bipod gun is `ww2:mg42_bipod`.
# Sources: Wikipedia "MG 42" (Lafette 42 20.5 kg; with the MGZ 34 sight
# 3,000 m direct and 3,500 m indirect; barrel changed after ~150 rounds of
# rapid fire, in under 10 s; optimum sustained-fire crew 6). Game ranges are
# compressed (rifles 300 m); the tripod gun reaches 2 x a rifle.
id = "ww2:mg42"
name = "MG 42 (Lafette 42)"
short_name = "MG 42 (s)"
class = "mg"
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:792x57_belt"
# The gunner's own load: the belt on the gun. The section's boxes are
# carried by the assistant and the bearers (members' `rounds`).
load = 150
sources = [
    "Wikipedia, MG 42 (Lafette 42 weight, tripod ranges, barrel change interval, crew)",
]
# Effective reach on the compressed scale (m).
range_m = 600
damage = 45
# Cyclic rate (rpm).
rounds_per_min = 1200
# Rounds between pauses: the barrel-change interval of rapid fire (~150).
magazine = 150
# Barrel change and belt (ms).
reload_ms = 8000
# Dispersion half-angle (mrad): the tripod holds the gun on the line.
spread_mrad = 12
muzzle_velocity_m_s = 740
# S8a (vehicles.md 6.4, owner question S8a-3 (A)): small arms against thin
# armour. The belt's SmK (steel-core AP) table stands for every round (no
# belt-mix roll): mm of RHA beaten at 0 deg, [range_m, mm], linear between
# rows, flat past the last (verify: SmK about 13 mm at the muzzle and 11 mm at 100 m on period
# German tables; quoted from memory).
penetration = [[0, 13], [100, 11], [300, 7], [600, 4]]
# A round past the plate goes on length_cm and strikes at most max_boxes
# boxes inside (crew, riders, components) for damage HP each; no spall.
core = { damage = 35, length_cm = 40, max_boxes = 1 }
# Mount, lay and load (ms): six seconds before the first burst.
setup_ms = 6000
suppression = 15
# Crew weapon hand-over (ms).
handover_ms = 3000
# S5a bursts (B1): on the Lafette tripod longer bursts of 10 rounds with
# 1.2 s pauses (about 350 rounds a minute sustained; starting values,
# verify against the sMG drill).
burst_rounds = 10
burst_pause_ms = 1200
