id = "ww2:m1_garand"
name = "M1 Garand"
class = "rifle"
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:3006_clip"
# Rounds a rifleman carries, the clip in the rifle included: the M1923
# belt (80), one bandolier (48) and the clip (8) (battleorder.org, US
# ammo load WW2: Army squad basis).
load = 136
range_m = 300
damage = 65
rounds_per_min = 24
magazine = 8
reload_ms = 3000
spread_mrad = 11
muzzle_velocity_m_s = 850
# S8a (vehicles.md 6.4): ball ammunition against thin armour, mm of RHA
# beaten at 0 deg, [range_m, mm] (verify; quoted from memory). It beats no
# plate in the game (the thinnest, the M3A1's 6.35 mm face-hardened side,
# counts as 7.9 mm); the table lets rifles aim at exposed crews only.
penetration = [[0, 7], [100, 5], [300, 3]]
# Past the plate: on length_cm, at most max_boxes boxes, damage HP each.
core = { damage = 30, length_cm = 30, max_boxes = 1 }
suppression = 8
sources = [
    "docs/design/roster/infantry-structures.md 4.2 (melee reach and timings: rifle butt 1.0 m, wind-up 0.4-0.8 s, recovery 1 s); damage per docs/slices/S14-assault-kit.md 4.3 (a torso strike wounds, two down a man)",
]
# S14 M1 (plan 4.3): his own strike with this weapon in his hands, a butt stroke:
# reach_cm 1..=1000, damage 0..=1000, windup_ms and recover_ms 1..=4000. Used
# only with the rules' [melee] enabled = 1 (0 in S14a).
melee = { reach_cm = 100, damage = 50, windup_ms = 600, recover_ms = 1000 }
