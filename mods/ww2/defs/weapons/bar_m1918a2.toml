# Browning Automatic Rifle M1918A2 (S4): the US rifle squad's automatic
# rifleman. Fired off its bipod by one man; not a crew weapon (it stays
# with its man, like a rifle).
# Sources: Wikipedia "M1918 Browning Automatic Rifle" (8.8 kg; A2 rates
# 300-450 rpm slow, 500-650 fast; 20-round box; 860 m/s).
id = "ww2:bar_m1918a2"
name = "BAR M1918A2"
short_name = "BAR"
class = "rifle"
# S5a: what each shot takes from the man's rounds (defs/cartridges).
feed = "ww2:3006_bar"
# Rounds the automatic rifleman carries: 11 magazines of 20 (battleorder.org;
# the squad carried 35 magazines, 700 rounds, with the assistant and bearer).
load = 220
crew_weapon = false
sources = [
    "Wikipedia, M1918 Browning Automatic Rifle (weight, rates, magazine, velocity)",
    "docs/design/roster/infantry-structures.md 4.2 (melee reach and timings: rifle butt 1.0 m, wind-up 0.4-0.8 s, recovery 1 s); damage per docs/slices/S14-assault-kit.md 4.3 (a torso strike wounds, two down a man)",
]
# Effective reach on the compressed scale (m): a little over a rifle's.
range_m = 350
damage = 65
# Rate (rpm): the A2's slow setting, 300-450.
rounds_per_min = 450
# 20-round box.
magazine = 20
reload_ms = 4000
# Dispersion half-angle (mrad): automatic fire off the bipod.
spread_mrad = 14
muzzle_velocity_m_s = 860
# S8a (vehicles.md 6.4): ball ammunition against thin armour, mm of RHA
# beaten at 0 deg, [range_m, mm] (verify; quoted from memory). It beats no
# plate in the game (the thinnest, the M3A1's 6.35 mm face-hardened side,
# counts as 7.9 mm); the table lets rifles aim at exposed crews only.
penetration = [[0, 7], [100, 5], [300, 3]]
# Past the plate: on length_cm, at most max_boxes boxes, damage HP each.
core = { damage = 30, length_cm = 30, max_boxes = 1 }
suppression = 10
# S5a bursts (B1): short bursts of 4 rounds, 0.6 s pause (BAR drill of
# 2-3 or 4-5 round bursts as summarised in secondary sources; starting
# values, verify against FM 23-15).
burst_rounds = 4
burst_pause_ms = 600
# S14 M1 (plan 4.3): his own strike with this weapon in his hands, a butt stroke:
# reach_cm 1..=1000, damage 0..=1000, windup_ms and recover_ms 1..=4000. Used
# only with the rules' [melee] enabled = 1 (0 in S14a).
melee = { reach_cm = 100, damage = 50, windup_ms = 600, recover_ms = 1000 }
