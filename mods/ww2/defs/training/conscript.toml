# Training profile (S4): a conscript (short training, little range time).
# Starting values by reasoning, not a measured source
# (docs/slices/S4-variants.md "Training profiles"): a quarter more aim error
# and aim time, slower reloads and wilder throws, a fifth less steady,
# slower to recover, sees a little less, digs a little slower. First used by
# the VG-Sturmgruppe (S5); no S4 card is conscript (S4-10 (A)).
id = "ww2:training_conscript"
name = "Conscript"
# Aim error: multiplies the weapon's spread (%).
spread_pct = 125
# Time to open fire on a new target (%).
aim_time_pct = 125
# Reload time (%).
reload_pct = 115
# Scatter of thrown items (%).
throw_scatter_pct = 125
# Multiplies the card's steadiness_pct: duck and pin thresholds (%).
steadiness_pct = 80
# Suppression decay per second (%).
suppression_decay_pct = 85
# The men's sight range (%).
spot_pct = 95
# Multiplies the card's dig_rate_pct (%).
build_rate_pct = 90
