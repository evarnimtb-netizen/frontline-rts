# Kessel Ridge: 1 km square. A ridge runs north-west to south-east through the
# centre (point C on its crest); shallow valleys cross the south and
# (S3c, mirrored) the north. Bases sit
# in the south-west and north-east corners. Coordinates are metres, x east,
# y north.
id = "ww2:kessel_ridge"
name = "Kessel Ridge"
size_m = 1024

[terrain]
# Terrain is fixed per map: this seed, not the match seed, shapes it.
seed = 1944
base_height_m = 20
octaves = [
    { period_m = 128, amplitude_cm = 500 },
    { period_m = 32, amplitude_cm = 100 },
]

[[terrain.ridges]]
# S4 Tune: the crest ran along x + y = 1030, 4 m on base 1's side of the map's
# centre line (x + y = 1024), and the contested centre point C sits on it.
# Mirror matches (Germany vs Germany, 160, seeds 1-160) gave base 0 108 wins
# with this ridge, 60 without it, 72 on a bare map; crest at x + y = 1024: 96,
# 1012: 72 (an overshoot). The crest now runs along x + y = 1018 (cross
# faction, 160 matches with the Tune costs: base 0 wins 79 of 160, was 100).
from = [157, 861]
to = [861, 157]
height_m = 14
width_m = 320

[[terrain.valleys]]
from = [0, 280]
to = [1024, 340]
depth_m = 5
width_m = 200

# S3c (S3b-40, S3c-8 (A)): the point-mirror of the south valley (through
# the map centre, 512/512). With only the south band, B (base 0's near
# point) sat in a hollow 15.6 m below C while D (base 1's) stood on flat
# ground: over 80 AI matches base 0 lost 134 tanks to base 1's 87, 64 of
# them near B to shooters a median 10 m higher. The mirrored band gave
# 110 vs 102 and base 1 52.5 % of wins (docs/slices/S3c-armour.md).
[[terrain.valleys]]
from = [1024, 744]
to = [0, 684]
depth_m = 5
width_m = 200

