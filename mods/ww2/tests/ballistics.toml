# Golden ballistics rows (S3, docs/slices/S3-armour.md "`frontline-cli
# ballistics`"). `frontline-cli ballistics --golden` runs them, and
# `cargo test` runs the same file through the sim's own armour functions
# (sdk/crates/cli/tests/ballistics.rs).
#
# Each row: ammo, target, zone, range (m), angle (horizontal degrees from
# the plate normal), optional descent (degrees or "auto") and track_band,
# and either expect = "pen" | "nonpen" | "ricochet" (every roll of the
# +-7 % band) or pen_pct = [lo, hi] (closed-form chance, inclusive). Rows
# 1-27 are the spec's table in order; the rest come from the --table grid
# and the edges. If the data changes, this file changes in the same
# commit, on purpose. S3b Tune: the 75 mm M61 rows (12-16, 18, 19, 28, 29,
# 32) moved with the M61's penetration table, corrected to the US
# published figures (defs/ammo/75mm_m61.toml). S3b Fix (review H2): all
# three AP rounds now use one source and criterion, Bird & Livingston's
# 0° (normal) tables (defs/ammo/75mm_m61.toml, 75mm_pzgr39.toml,
# 75mm_pzgr40.toml); rows 4, 5, 7, 10, 12-16, 18, 19, 28, 29, 32, 38,
# 44 and 45 moved with them (the M61 rows back near their S3 values).


