# S4 example variant (docs/modding/variants.md, target T9): a unit card made
# of `extends` and a member list. Everything not set here (faction, cost,
# cooldown, speed, sight, spacing, digging) comes from the parent.
#
# Load it with `ModDefs::add_defs_dir("mods/ww2/tests/variants")`; it is
# called in through the roster patch in `roster.toml` beside this folder.
# `frontline-cli validate mods/ww2` checks both. The shipped understrength
# card (9 men, S4 Part B content) will live in defs/units/.
id = "ww2:usa_rifle_squad_understrength"
extends = "ww2:usa_rifle_squad"
name = "Rifle Squad (understrength)"
# "understrength" is a reserved tag (the HUD marker); "line" keeps it in the
# AI's line-infantry mix.
tags = ["line", "understrength"]

# [[members]] replaces the parent's men/weapon/loadout (a variant either
# inherits the parent's men or lists its own). The first man of the first
# slot is the squad leader.
[[members]]
slot = "squad_leader"
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 2, "ww2:m15_smoke" = 1 }
traits = ["leader"]

[[members]]
slot = "rifleman"
# A 12-man squad worn down to nine (owner question Q6 (A): cheaper
# understrength cards).
count = 8
weapon = "ww2:m1_garand"
items = { "ww2:mk2_grenade" = 1 }
